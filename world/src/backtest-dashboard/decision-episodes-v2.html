function inferredHeaders(rows){

  if(first.length===11)return ["类别","报告来源","行情标的","最新价","涨跌幅","振幅","量比","成交额","近5日","近20日","行情时间"];

function renderMarkdownTable(rows){

function markdown(value){
  let text=esc(chineseDisplay(value));
  text=text.replace(/\*\*([^*]+)\*\*/g,(_,x)=>`<strong>`+x+`</strong>`);
  text=text.replace(/`([^`]+)`/g,(_,x)=>`<code>`+x+`</code>`);
  const chunks=[],rows=[];
  const flushTable=()=>{if(rows.length){chunks.push(renderMarkdownTable(rows.splice(0,rows.length)))}};
  for(const line of text.split("\n")){
    const trimmed=line.trim();
    if(trimmed.startsWith("|")){rows.push(trimmed.split("|").slice(1,-1).map(cell=>cell.trim()));continue}
    flushTable();
    chunks.push(trimmed.startsWith("- ")?`• `+trimmed.slice(2):line)
  }
  flushTable();
  return chunks.join("<br>")
}

async function loadDetail(id){
  activeCaseId=id;
  $("caseList").querySelectorAll(".case").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  $("detail").innerHTML="<div class=\"loading\">读取最终 Canonical…</div>";
  try{
    const response=await fetch("/api/episode?episode_id="+encodeURIComponent(id));
    if(!response.ok)throw new Error("Canonical HTTP "+response.status);
    renderDetail(await response.json());
  }catch(error){$("detail").innerHTML=`<div class="empty">读取失败：${esc(error.message)}</div>`}
}

async function init(){
  try{
    const response=await fetch("/api/catalog");
    const data=await response.json();
    if(!data.available)throw new Error(data.reason||"数据库不可用");
    $("dbState").textContent=data.source.filename+" · "+data.source.schemaVersion+" · 最终只读库";
    renderMetrics(data.summary);
    catalogCases=[...data.episodes];
    $("runFilter").innerHTML=`<option value="">全部 run_id</option>`+arr(data.filters?.runs).sort().map(run=>`<option value="${esc(run)}">${esc(run)}</option>`).join("");
    const dates=catalogCases.map(item=>item.trade_date).sort();
    if(dates.length){$("dateFrom").min=dates[0];$("dateFrom").max=dates[dates.length-1];$("dateTo").min=dates[0];$("dateTo").max=dates[dates.length-1]}
    $("runFilter").addEventListener("change",applyDateFilter);$("dateFrom").addEventListener("change",applyDateFilter);$("dateTo").addEventListener("change",applyDateFilter);$("clearDateFilter").addEventListener("click",()=>{$("runFilter").value="";$("dateFrom").value="";$("dateTo").value="";applyDateFilter()});
    const rows=renderCases(catalogCases);
    if(rows[0])loadDetail(rows[0].episode_id);
  }catch(error){$("dot").style.background="var(--red)";$("dbState").textContent="Canonical数据库不可用";$("caseList").innerHTML=`<div class="empty">${esc(error.message)}</div>`}
}init();

</script>
</body>
</html>
