<body>
<main class="shell">
  <header class="top"><div><div class="eyebrow">决策事件 / 小批次质检</div><h1>决策事件数据清洗看板</h1><div class="subtitle">事实、关系、可验证主张、冲突与动作分层检查 · 只读</div></div><div class="db"><span class="dot" id="dot"></span><span id="dbState">读取数据库…</span></div></header>
  <div class="notice"><strong>当前只看 7 个交易日。</strong> Agent 自述不会升级成硬事实；黄色标记表示字段仍需人工或后续抽取补齐。</div>
  <section class="glossary"><strong>字段速览</strong><span><b>事实</b>：可从来源直接核对</span><span><b>类型关系</b>：主体到对象的结构化连接</span><span><b>可验证主张</b>：能被证据支持或反驳的判断</span><span><b>证据绑定</b>：与主张关联的依据</span><span><b>冲突</b>：相互矛盾或执行重试记录</span><span><b>质量告警</b>：仍需人工检查的项目</span></section>
  <section class="metrics" id="metrics"></section>
  <section class="toolbar"><input id="search" type="search" placeholder="搜索日期、摘要、运行批次或机器人…"><select id="status"><option value="">全部抽取状态</option></select><select id="quality"><option value="">全部质量</option><option value="warning">有质量告警</option><option value="clean">无质量告警</option><option value="actions">发生交易动作</option></select></section>
  <section class="workspace"><aside class="pane"><div class="pane-head"><span class="pane-title">决策事件（Episode）</span><span class="count" id="episodeCount">—</span></div><div class="scroll episode-list" id="episodeList"><div class="loading"></div></div></aside><article class="pane"><div class="pane-head"><span class="pane-title">结构化审计详情</span><span class="count">只读</span></div><div class="scroll" id="detail"><div class="detail-empty">选择一个交易日查看清洗结果</div></div></article></section>
</main>

const state={catalog:null,items:[],selected:''};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const arr=v=>Array.isArray(v)?v:[];const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};const fmt=v=>v===null||v===undefined||v===''?'—':String(v);const short=(v,n=180)=>String(v??'').length>n?String(v).slice(0,n)+'…':String(v??'');
const ZH={"normalized":"已标准化","partial":"部分抽取","recorded_fact":"数据库记录事实","agent_reported_observation":"智能体自述观察","hard_recorded":"硬记录","agent_asserted":"智能体自述","hard_reference":"硬参考记录","OWNS":"持有","TRACKS_INDEX":"跟踪指数","portfolio_to_instrument":"投资组合 → 标的","fund_to_index":"基金 → 指数","database_snapshot":"数据库快照","fund_master_record":"基金主数据","market_interpretation":"市场解读","policy_interpretation":"策略规则解读","market_prediction":"市场预测","estimated":"估计判断","policy_defined":"策略明确规定","UNCERTAIN":"关系不确定","REFUTES":"反驳","SUPPORTS":"支持","research":"研究材料","macro":"宏观证据","technical":"技术面证据","flow":"资金流证据","agent_narrative":"智能体叙述","unverified":"尚未核验","agent_reported_decision_conflict":"智能体自述决策冲突","conflicting_reported_metric":"指标报告相互冲突","execution_retry":"执行重试冲突","unresolved":"未解决","resolved":"已解决","data_quality_conflict":"数据质量冲突","SELL":"卖出","BUY":"买入","REDUCE":"减仓","ADD":"加仓","unknown":"未知","rejected":"已拒绝","accepted":"已接受","transport_error":"传输错误","database_not_found":"数据库未找到记录","database_confirmed":"数据库已确认","database_recorded":"数据库已记录","confirmed":"已确认","warning":"警告","info":"提示","decision_time_date_only":"决策时间仅精确到日期","invalid_historical_holding_rows":"历史持仓行无效","no_claims_extracted":"未抽取到结构化主张","snapshot_timing_mismatch":"快照时间不一致","claim_structure_incomplete":"主张结构不完整","transport_error_database_reconciled":"传输错误已由数据库对账确认","belief_validation":"观点验证材料","close_snapshot":"收盘快照","portfolio_database":"投资组合数据库","run_status":"运行状态","session_input":"会话输入","session_reply":"会话回复","sha256_verified":"SHA-256 已校验","record_hash_only":"仅有记录哈希","HOLDING_WEIGHT":"持仓权重","BOND_WEIGHT":"债券仓位","CASH_WEIGHT":"现金仓位","CUMULATIVE_RETURN":"累计收益率","DAILY_RETURN":"当日收益率","EQUITY_WEIGHT":"权益仓位","GOLD_WEIGHT":"黄金仓位","INITIAL_CAPITAL":"初始资金","MAX_DRAWDOWN":"最大回撤","NET_VALUE":"单位净值","TOTAL_VALUE":"总资产","DISTANCE_TO_MA120":"距 120 日均线","CASH":"现金","CASH_AVAILABLE":"可用现金","CASH_IN_TRANSIT":"在途现金","CASH_RECEIVABLE":"应收现金","INVESTED_VALUE":"已投资金额","MARKET_VALUE":"持仓市值"};const ISSUE_DESC={"claim_structure_incomplete":"部分主张缺少明确机制、证伪条件，或缺少精确到来源记录的证据绑定。","decision_time_date_only":"会话能确定业务日期，但没有唯一且精确到本地时间的决策时间戳。","invalid_historical_holding_rows":"收盘快照包含持有天数为负数的历史持仓行；这些行未被当作当前持仓导入。","no_claims_extracted":"最终回复中未能恢复出结构化主张，需要人工复核。","snapshot_timing_mismatch":"会话收盘快照与已结算数据库快照不同；两者均被保留，不能直接合并。","transport_error_database_reconciled":"工具调用报告传输错误，但 fund.db 中存在对应订单，已完成数据库对账。"};function zhText(v){const raw=String(v??"");return ZH[raw]??raw}function enumHtml(v){const raw=String(v??"");const label=zhText(raw);return label===raw?esc(raw):`<span title="数据库原始值：${esc(raw)}">${esc(label)}<small class="raw-code">(${esc(raw)})</small></span>`}function badge(text,kind="",translate=false){return `<span class="badge ${kind}">${translate?enumHtml(text):esc(text)}</span>`}function renderMetrics(s){const x=[["决策事件",s.episodes,"一个交易日对应的一次完整决策记录"],["事实",s.facts,"能从数据库、快照或原始会话直接核对的记录"],["类型关系",s.relations,"主体、关系和对象组成的结构化连接"],["可验证主张",s.claims,"可由证据支持、反驳或保留不确定性的判断"],["证据绑定",s.evidence,"已经关联到具体主张的研究或数据依据"],["冲突",s.conflicts,"相互矛盾的数据、判断或执行重试"],["质量告警",s.warnings,"仍需人工检查或后续补齐的项目","warn"]];$("metrics").innerHTML=x.map(i=>`<div class="metric ${i[3]||""}" title="${esc(i[2])}"><div class="label">${esc(i[0])}</div><div class="value">${esc(i[1])}</div><div class="hint">${esc(i[2])}</div></div>`).join("")}
function apply(){const q=$('search').value.trim().toLowerCase(),status=$('status').value,quality=$('quality').value;state.items=state.catalog.episodes.filter(e=>{const hay=`${e.trade_date} ${e.final_summary} ${e.run_id} ${e.bot_id}`.toLowerCase();if(q&&!hay.includes(q))return false;if(status&&e.extraction_status!==status)return false;if(quality==='warning'&&!Number(e.warning_count))return false;if(quality==='clean'&&Number(e.warning_count))return false;if(quality==='actions'&&!Number(e.final_action_count))return false;return true});renderList()}
const MECHANISM_EXACT={"index fund replication or feeder-fund exposure":"通过指数基金复制指数表现，或通过联接基金形成间接投资敞口。","end-of-day portfolio position recorded in fund_bot_daily_snapshots":"该持仓来自日终投资组合快照表 fund_bot_daily_snapshots 的数据库记录。"};function mechanismZh(v){const raw=String(v??"");return MECHANISM_EXACT[raw]??raw}function mechanismHtml(v){const raw=String(v??"");return `<span title="数据库原始机制：${esc(raw)}">${esc(mechanismZh(raw))}</span>`}
function renderList(){$("episodeCount").textContent=`${state.items.length} / ${state.catalog.episodes.length}`;if(!state.items.length){$("episodeList").innerHTML=`<div class="empty">无匹配的决策事件</div>`;return}$("episodeList").innerHTML=state.items.map(e=>`<div class="episode ${state.selected===e.episode_id?"active":""}" data-id="${esc(e.episode_id)}"><div class="episode-date">${esc(e.trade_date)}</div><div class="episode-status">${badge(e.extraction_status,e.extraction_status==="normalized"?"ok":"warn",true)}${Number(e.warning_count)?badge(`${e.warning_count} 条告警`,"warn"):badge("无告警","ok")}${Number(e.final_action_count)?badge(`${e.final_action_count} 个动作`,"blue"):""}</div><div class="episode-summary">${esc(e.final_summary)}</div><div class="episode-foot"><span>事实 ${e.fact_count} · 关系 ${e.relation_count} · 主张 ${e.claim_count}</span><span>冲突 ${e.conflict_count}</span></div></div>`).join("");$("episodeList").querySelectorAll(".episode").forEach(el=>el.addEventListener("click",()=>selectEpisode(el.dataset.id)))}
function section(title,count,body){return `<section class="section"><div class="section-title"><span>${esc(title)}</span><span class="count">${esc(count)}</span></div>${body}</section>`}function table(headers,rows){if(!rows.length)return '<div class="empty">无记录</div>';return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function renderIssues(items){return items.map(x=>`<div class="issue ${x.severity==="info"?"info":""}"><div class="issue-title">${badge(x.severity,x.severity==="warning"?"warn":"blue",true)}<strong>${enumHtml(x.issue_type)}</strong></div><div class="issue-copy">${esc(ISSUE_DESC[x.issue_type]||x.description)}</div>${ISSUE_DESC[x.issue_type]?`<div class="original-note">英文原始说明：${esc(x.description)}</div>`:""}<div class="issue-path">字段路径：${esc(x.field_path)}<br>来源定位：${esc(x.source_locator)}</div></div>`).join("")||`<div class="empty">无质量告警</div>`}
function renderFacts(items){return table(["主体 / 属性（Subject / Predicate）","记录值","事实类型","可信等级","发生或有效时间","来源定位"],items.map(x=>`<tr><td><div class="mono">${esc(x.subject)}</div><strong>${enumHtml(x.predicate)}</strong>${x.object_text?`<div>对象：${esc(x.object_text)}</div>`:""}</td><td class="mono">${esc(fmt(x.value_number??x.value_text))} ${esc(x.unit||"")}</td><td>${enumHtml(x.fact_class)}</td><td class="certainty">${badge(x.certainty,x.certainty.includes("hard")?"ok":"warn",true)}</td><td>${esc(x.event_time||x.valid_from||"—")}</td><td class="source">${esc(x.source_locator)}</td></tr>`))}
function renderRelations(items){return table(["关系链（主体 → 关系 → 对象）","作用机制","有效时间区间","证据类型 / 来源","可信等级"],items.map(x=>`<tr><td><div class="mono">${esc(x.subject)}</div><strong>${enumHtml(x.predicate)}</strong> → <span class="mono">${esc(x.object)}</span><div class="muted">方向：${enumHtml(x.direction)}</div></td><td class="mechanism">${mechanismHtml(x.mechanism)}</td><td>${esc(x.valid_from||"未知")} → ${esc(x.valid_to||"持续有效")}</td><td><div>${enumHtml(x.evidence_type)}</div><div class="source">${esc(x.source_locator)}</div></td><td>${badge(x.certainty,x.certainty.includes("hard")?"ok":x.certainty==="policy_defined"?"blue":"warn",true)}</td></tr>`))}
function renderClaims(items){return `<div class="claim-grid">${items.map(c=>{const ev=arr(c.evidence);return `<div class="claim"><div class="claim-top"><div>${badge(c.claim_type,"blue",true)} ${badge(c.certainty,c.certainty==="estimated"?"warn":"violet",true)}</div><span class="claim-meta">${c.confidence==null?"":`置信度 p=${esc(c.confidence)}`}</span></div><div class="claim-text">${esc(c.statement)}</div><div class="claim-meta">作用机制：${arr(c.mechanism).length?arr(c.mechanism).map(mechanismHtml).join("；"):"未结构化"} · 证伪条件：${arr(c.falsifiers).length?esc(arr(c.falsifiers).join("；")):"未结构化"}</div>${ev.map(e=>`<div class="evidence ${e.relation==="SUPPORTS"?"support":e.relation==="REFUTES"?"refute":""}"><strong>${enumHtml(e.relation)}</strong> · 证据类型：${enumHtml(e.evidence_type)} · 核验状态：${enumHtml(e.verification_status)}<br>${esc(short(e.raw_excerpt,240))}</div>`).join("")}</div>`}).join("")||`<div class="empty">本日没有抽取到可验证主张</div>`}</div>`}
function renderConflicts(items){return items.map(c=>`<div class="conflict"><div>${badge(c.conflict_type,"violet",true)} ${badge(c.status,c.status==="resolved"?"ok":"warn",true)}</div><div class="versus"><div class="side">${esc(c.left_statement)}</div><div class="vs">对照</div><div class="side">${esc(c.right_statement)}</div></div>${c.resolution?`<div class="issue-copy"><strong>处理方式：</strong>${esc(c.resolution)}</div>`:""}</div>`).join("")||`<div class="empty">无冲突记录</div>`}
function renderCandidates(items){return table(["工具调用编号 / 标的","请求动作（金额 / 份额）","工具返回结果","数据库对账结果","动作理由"],items.map(x=>`<tr><td class="mono">${esc(x.tool_call_id)}<br>${esc(x.instrument||"")}</td><td>${enumHtml(x.action_type)} · 金额 ${esc(fmt(x.requested_amount))} · 份额 ${esc(fmt(x.requested_shares))}</td><td>${badge(x.observed_tool_outcome,x.observed_tool_outcome==="accepted"?"ok":x.observed_tool_outcome==="transport_error"?"warn":"red",true)}</td><td>${badge(x.reconciled_outcome,x.reconciled_outcome==="database_confirmed"?"ok":"warn",true)}</td><td>${esc(short(x.reason,300))}</td></tr>`))}
function renderFinal(items){return table(["数据库记录位置","最终动作","金额 / 份额","核验状态","动作理由"],items.map(x=>`<tr><td class="mono">${esc(x.source_table)}:${esc(x.source_primary_key)}</td><td>${enumHtml(x.action_type)} ${esc(x.instrument||"")}</td><td>${esc(fmt(x.amount))} / ${esc(fmt(x.shares))}</td><td>${badge(x.verification_status,"ok",true)}<br>${enumHtml(x.status||"")}</td><td>${esc(short(x.reason,300))}</td></tr>`))}
async function selectEpisode(id){state.selected=id;renderList();$("detail").innerHTML=`<div class="loading"></div><div class="loading"></div>`;try{const r=await fetch(`/api/episode?episode_id=${encodeURIComponent(id)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json(),e=d.episode;$("detail").innerHTML=`<div class="detail"><div class="detail-head"><div><div class="eyebrow">运行批次：${esc(e.run_id)} / 机器人：${esc(e.bot_id)}</div><h2>${esc(e.trade_date)}</h2><div class="summary">${esc(e.final_summary)}</div></div><div>${badge(e.extraction_status,e.extraction_status==="normalized"?"ok":"warn",true)}</div></div>${section("质量告警",d.issues.length,renderIssues(d.issues))}${section("事实层",d.facts.length,renderFacts(d.facts))}${section("类型化关系 · 六维审计",d.relations.length,renderRelations(d.relations))}${section("可验证主张与证据",d.claims.length,renderClaims(d.claims))}${section("保留冲突",d.conflicts.length,renderConflicts(d.conflicts))}<div class="split">${section("候选动作 / 重试",d.candidateActions.length,renderCandidates(d.candidateActions))}${section("数据库确认的最终动作",d.finalActions.length,renderFinal(d.finalActions))}</div>${section("来源工件",d.sources.length,table(["工件类型","完整性校验","SHA-256 哈希摘要","文件路径"],d.sources.map(s=>`<tr><td>${enumHtml(s.artifact_kind)}</td><td>${badge(s.integrity_status,s.integrity_status==="sha256_verified"?"ok":"warn",true)}</td><td class="mono">${esc(short(s.sha256,18))}</td><td class="source">${esc(s.source_path)}</td></tr>`)))}</div>`}catch(err){$("detail").innerHTML=`<div class="detail-empty">读取失败：${esc(err.message)}</div>`}}
async function init(){try{const r=await fetch("/api/catalog");if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(!d.available)throw new Error(d.reason||"数据库不可用");state.catalog=d;state.items=d.episodes;$("dbState").textContent=`${d.source.filename} · 数据结构 v${d.source.schemaVersion} · 只读`;renderMetrics(d.summary);$("status").innerHTML=`<option value="">全部抽取状态</option>`+d.filters.statuses.map(x=>`<option value="${esc(x)}">${esc(zhText(x))}（${esc(x)}）</option>`).join("");apply();if(state.items[0])selectEpisode(state.items[0].episode_id)}catch(err){$("dot").style.background="var(--red)";$("dbState").textContent="数据库不可用";$("episodeList").innerHTML=`<div class="empty">${esc(err.message)}</div>`}}
['search','status','quality'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',apply));init();
</script>
</body>
</html>
