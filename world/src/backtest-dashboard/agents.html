<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 对话台 · 物理AI / 链芯 / 市场报告</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --rail:#2e2e2e; --rail-ico:#8a8a8a; --rail-ico-on:#07c160;
  --side:#f7f7f7; --side-line:#e6e6e6; --side-sel:#c9c9c9; --side-hover:#ededed;
  --chat-bg:#f5f5f5; --hdr:#f5f5f5; --hdr-line:#e3e3e3;
  --recv:#ffffff; --sent:#95ec69; --green:#07c160; --green-d:#06ad56;
  --tx:#191919; --tx2:#5e5e5e; --tx3:#9a9a9a; --red:#fa5151;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{font-family:var(--ui);color:var(--tx);background:var(--chat-bg);overflow:hidden;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.wx{display:flex;height:100vh;width:100vw}

/* ---------- 最左图标栏 ---------- */
.rail{width:56px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;
  padding:18px 0 12px}
.rail .me{width:36px;height:36px;border-radius:6px;background:#4c6ef5;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:600;margin-bottom:22px}
.rail .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--rail-ico);
  cursor:pointer;border-radius:6px;margin-bottom:6px;transition:.15s}
.rail .ico svg{width:22px;height:22px;fill:currentColor}
.rail .ico.on{color:var(--rail-ico-on)}
.rail .ico:hover{color:#cfcfcf}
.rail .sp{flex:1}
.rail .ico.back svg{width:20px;height:20px}

/* ---------- 会话列表 ---------- */
.side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--side-line);
  display:flex;flex-direction:column;min-width:0}
.search{padding:11px 14px 9px;display:flex;gap:9px;align-items:center}
.search .box{flex:1;height:30px;background:#e7e7e7;border-radius:6px;display:flex;align-items:center;
  gap:6px;padding:0 9px;color:var(--tx3)}
.search .box svg{width:14px;height:14px;fill:#9a9a9a;flex:none}
.search .box input{border:0;background:transparent;outline:0;font-size:13px;color:var(--tx);width:100%;font-family:var(--ui)}
.list{flex:1;overflow-y:auto;scrollbar-width:thin}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:3px}
.item{display:flex;gap:11px;padding:11px 14px;cursor:pointer;align-items:center;position:relative}
.item:hover{background:var(--side-hover)}
.item.sel{background:var(--side-sel)}
.item.sel:hover{background:var(--side-sel)}
.av{width:42px;height:42px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:600;position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;background:var(--red);
  color:#fff;border-radius:9px;font-size:11px;line-height:17px;text-align:center;font-weight:500;
  box-shadow:0 0 0 2px var(--side)}
.item.sel .badge{box-shadow:0 0 0 2px var(--side-sel)}
.it-main{flex:1;min-width:0}
.it-top{display:flex;align-items:baseline;gap:8px}
.it-name{font-size:14.5px;color:#0f0f0f;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.it-time{font-size:11px;color:var(--tx3);flex:none}
.it-prev{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

/* ---------- 对话主区 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat-bg)}
.m-hdr{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;
  border-bottom:1px solid var(--hdr-line);background:var(--hdr)}
.m-back{display:none;border:0;background:transparent;color:#444;font-size:22px;cursor:pointer;padding:0 4px 0 0}
.m-title{font-size:16.5px;font-weight:500;color:#0f0f0f}
.m-sub{font-size:12px;color:var(--tx3);margin-left:2px}
.m-sub b{color:var(--green);font-weight:500}
.compose-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m-new{border:1px solid var(--hdr-line);background:#fff;color:#555;font-family:var(--ui);
  font-size:12.5px;padding:5px 12px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.m-new:hover{border-color:var(--green);color:var(--green-d);background:#f3faf4}
.m-new:active{transform:scale(.96)}
.m-new svg{width:13px;height:13px;fill:currentColor}

.scroll{flex:1;overflow-y:auto;padding:18px 22px 8px;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:4px}
.pane{display:none;flex-direction:column}
.pane.show{display:flex}

.sys{align-self:center;max-width:80%;text-align:center;font-size:12px;color:#9a9a9a;
  background:#e1e1e1;border-radius:5px;padding:3px 9px;margin:6px 0}
.sys.intro{background:transparent;color:#a6a6a6;line-height:1.7;max-width:90%}
.sys.intro b{color:#7a7a7a;font-weight:600}

.row{display:flex;gap:10px;margin:13px 0;align-items:flex-start}
.row.sent{flex-direction:row-reverse}
.row .av{width:40px;height:40px;border-radius:5px;font-size:16px}
.bub{position:relative;max-width:62%;padding:9px 13px;font-size:14px;line-height:1.55;color:var(--tx);
  word-break:break-word;white-space:pre-wrap;border-radius:5px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.row.recv .bub{background:var(--recv)}
.row.recv .bub::before{content:"";position:absolute;left:-5px;top:13px;width:0;height:0;
  border:6px solid transparent;border-right-color:var(--recv);border-left:0}
.row.sent .bub{background:var(--sent)}
.row.sent .bub::before{content:"";position:absolute;right:-5px;top:13px;width:0;height:0;
  border:6px solid transparent;border-left-color:var(--sent);border-right:0}
.bub b{font-weight:600}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(0,0,0,.06);
  padding:1px 5px;border-radius:3px}
.bub .err{color:var(--red)}
/* ---- AI 回复 markdown 渲染 ---- */
.bub.md{white-space:normal;max-width:80%}
.bub.md>:first-child{margin-top:0}
.bub.md>:last-child{margin-bottom:0}
.bub.md p{margin:7px 0}
.bub.md h4,.bub.md h5,.bub.md h6{margin:12px 0 6px;font-weight:600;line-height:1.32}
.bub.md h4{font-size:15.5px}
.bub.md h5{font-size:14.5px}
.bub.md h6{font-size:13.5px;color:#5a6a60}
.bub.md ul,.bub.md ol{margin:6px 0;padding-left:20px}
.bub.md li{margin:3px 0}
.bub.md li>ul,.bub.md li>ol{margin:2px 0}
.bub.md blockquote{margin:8px 0;padding:5px 12px;border-left:3px solid var(--green);
  background:rgba(26,173,25,.06);color:#4a5a50;border-radius:0 4px 4px 0}
.bub.md hr{border:0;border-top:1px solid var(--hdr-line);margin:12px 0}
.bub.md a{color:var(--green-d);text-decoration:none;border-bottom:1px solid rgba(26,173,25,.35)}
.bub.md a:hover{border-bottom-color:var(--green-d)}
.bub.md pre{margin:8px 0;padding:11px 13px;background:#0f1620;color:#e6edf3;border-radius:7px;
  overflow-x:auto;font-size:12.5px;line-height:1.55}
.bub.md pre code{background:transparent;padding:0;color:inherit}
/* 表格 */
.bub.md table{border-collapse:separate;border-spacing:0;margin:9px 0;font-size:12.5px;
  display:block;max-width:100%;overflow-x:auto;border:1px solid var(--hdr-line);border-radius:8px}
.bub.md thead th{background:#eef4f0;color:#173d2a;font-weight:600;white-space:nowrap;
  position:sticky;top:0;border-bottom:1px solid #d4e3da}
.bub.md th,.bub.md td{padding:7px 12px;text-align:left;vertical-align:top;
  border-right:1px solid var(--hdr-line);border-bottom:1px solid var(--hdr-line);line-height:1.45}
.bub.md th:last-child,.bub.md td:last-child{border-right:0}
.bub.md tbody tr:last-child td{border-bottom:0}
.bub.md tbody tr:nth-child(even){background:rgba(0,0,0,.022)}
.bub.md tbody tr:hover{background:#f0faf2}
.bub.md td{white-space:nowrap}
.caret{display:inline-block;width:6px;height:15px;background:#1aad19;vertical-align:-3px;margin-left:1px;
  border-radius:1px;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 输入区 ---------- */
.composer{flex:none;border-top:1px solid var(--hdr-line);background:var(--chat-bg);
  display:flex;flex-direction:column;padding:12px 14px}
.composer textarea{border:0;background:transparent;outline:0;resize:none;font-family:var(--ui);font-size:14.5px;
  color:var(--tx);line-height:1.6;height:92px;padding:2px 4px}
.send-row{display:flex;justify-content:flex-end;align-items:center;height:34px}
.send-btn{border:0;border-radius:4px;padding:6px 18px;font-size:13.5px;font-family:var(--ui);cursor:pointer;
  background:#e6e6e6;color:#9a9a9a;transition:.15s}
.send-btn.ready{background:#dff5e4;color:var(--green-d)}
.send-btn.ready:hover{background:#cfeede}
.send-btn:disabled{cursor:not-allowed}

@media(max-width:760px){
  .rail{display:none}
  .side{width:100%;border-right:0}
  .main{display:none}
  .wx.chatopen .side{display:none}
  .wx.chatopen .main{display:flex;width:100%}
  .m-back{display:block}
}
</style>
</head>
<body>
<div class="wx" id="wx">
  <!-- 图标栏 -->
  <nav class="rail">
    <div class="me">研</div>
    <div class="ico on" title="对话"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.5 1.3 4.7 3.4 6.2L4.6 21l3.7-1.7c1.1.3 2.4.5 3.7.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg></div>
    <div class="sp"></div>
    <a class="ico back" href="/market-reports.html" title="返回市场报告"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg></a>
  </nav>

  <!-- 会话列表 -->
  <aside class="side">
    <div class="search">
      <div class="box"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input id="search" type="text" placeholder="搜索" autocomplete="off"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <!-- 对话主区 -->
  <section class="main">
    <header class="m-hdr">
      <button class="m-back" id="back" title="返回">‹</button>
      <span class="m-title" id="title"></span>
      <span class="m-sub" id="sub"></span>
    </header>
    <div class="scroll" id="scroll"></div>
    <div class="composer">
      <div class="compose-tools"><button class="m-new" id="newsess" title="开启新会话（清空当前对话，重置会话上下文）"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>新会话</button></div>
      <textarea id="input" placeholder="" rows="1"></textarea>
      <div class="send-row"><button class="send-btn" id="send" disabled>发送</button></div>
    </div>
  </section>
</div>

<script>
(function(){
  // ---- agent 配置：type=ws → research-loop :18890 流式；type=sse → 同源 /api/bot101/chat ----
  const AGENTS=[
    {id:'bot21', type:'ws', bot:'bot21', name:'bot21 · 物理AI', tag:'物理AI赛道 · 选基择时 · 组合调仓',
      av:'物', color:'#f59e3c', intro:'<b>bot21·物理AI研究员</b>：物理AI赛道景气、主动基金选基/择时、组合调仓，问我都行。'},
    {id:'bot22', type:'ws', bot:'bot22', name:'bot22 · 链芯', tag:'AI产业链 · 核心组合 · 板块技术面',
      av:'链', color:'#18b6b6', intro:'<b>链芯 🔗</b>：AI 产业链怎么配、东财AI核心组合、某只基金卡位哪一环、板块技术面，都可以问我。'},
    {id:'bot101', type:'sse', bot:'bot101', name:'bot101 · 市场报告', tag:'大盘研判 · OOS 回测复盘',
      av:'报', color:'#e0a82e', intro:'<b>bot101·市场报告研究员</b>：可现场调只读工具拉 PIT 数据，问我大盘研判、回测复盘都行。'}
  ];
  const WS_BASE=`${location.protocol==='https:'?'wss':'ws'}://${location.hostname}:18890/ws`;
  const SESSION='hub';
  const USER_AV={av:'研',color:'#4c6ef5'};
  const LS_KEY=id=>'wxhub:'+id;
  const loadLog=id=>{try{return JSON.parse(localStorage.getItem(LS_KEY(id))||'[]');}catch(_){return [];}};
  const saveLog=(id,log)=>{try{localStorage.setItem(LS_KEY(id),JSON.stringify(log.slice(-200)));}catch(_){}};
  function hhmm(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}
  function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
  const esc=s=>(s==null?'':String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  function inlineMd(s){
    return s
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      .replace(/`([^`]+?)`/g,'<code>$1</code>')
      .replace(/\[([^\]]+?)\]\((https?:[^)\s]+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  const _isSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l)&&l.includes('-');
  function md(src){
    const L=esc(src).split('\n'); let H='',i=0; const n=L.length;
    const isLi=l=>/^\s*[-*+]\s+/.test(l), isOl=l=>/^\s*\d+\.\s+/.test(l), isH=l=>/^#{1,6}\s+/.test(l), isBq=l=>/^\s*&gt;\s?/.test(l);
    const isTbl=k=>L[k].includes('|')&&k+1<n&&_isSep(L[k+1]);
    while(i<n){
      const ln=L[i];
      if(/^```/.test(ln.trim())){ const c=[]; i++; while(i<n&&!/^```/.test(L[i].trim())){c.push(L[i]);i++;} i++; H+='<pre><code>'+c.join('\n')+'</code></pre>'; continue; }
      if(isTbl(i)){
        const pr=r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
        const hd=pr(ln); i+=2; const rs=[];
        while(i<n&&L[i].includes('|')&&L[i].trim()!==''){ rs.push(pr(L[i])); i++; }
        let t='<table><thead><tr>'+hd.map(h=>'<th>'+inlineMd(h)+'</th>').join('')+'</tr></thead><tbody>';
        for(const r of rs) t+='<tr>'+hd.map((_,c)=>'<td>'+inlineMd(r[c]||'')+'</td>').join('')+'</tr>';
        H+=t+'</tbody></table>'; continue;
      }
      const hm=ln.match(/^(#{1,6})\s+(.*)$/);
      if(hm){ const lv=Math.min(hm[1].length+2,6); H+='<h'+lv+'>'+inlineMd(hm[2])+'</h'+lv+'>'; i++; continue; }
      if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ H+='<hr>'; i++; continue; }
      if(isBq(ln)){ const q=[]; while(i<n&&isBq(L[i])){ q.push(L[i].replace(/^\s*&gt;\s?/,'')); i++; } H+='<blockquote>'+inlineMd(q.join('<br>'))+'</blockquote>'; continue; }
      if(isLi(ln)){ const it=[]; while(i<n&&isLi(L[i])){ it.push(L[i].replace(/^\s*[-*+]\s+/,'')); i++; } H+='<ul>'+it.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ul>'; continue; }
      if(isOl(ln)){ const it=[]; while(i<n&&isOl(L[i])){ it.push(L[i].replace(/^\s*\d+\.\s+/,'')); i++; } H+='<ol>'+it.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ol>'; continue; }
      if(ln.trim()===''){ i++; continue; }
      const p=[]; while(i<n&&L[i].trim()!==''&&!/^```/.test(L[i].trim())&&!isH(L[i])&&!isLi(L[i])&&!isOl(L[i])&&!isBq(L[i])&&!isTbl(i)){ p.push(L[i]); i++; }
      H+='<p>'+inlineMd(p.join('<br>'))+'</p>';
    }
    return H;
  }
  const plain=s=>String(s||'').replace(/\*\*|`/g,'').replace(/\s+/g,' ').trim();

  // ================= 适配器（两套协议归一成同一组回调）=================
  function WsAgentAdapter(bot){
    let ws=null,connected=false,retry=0,cb=null,streamed=false,turn=false;const sub={};
    const setStatus=s=>sub.onStatus&&sub.onStatus(s);
    function finalize(){ if(turn){turn=false; cb&&cb.onDone&&cb.onDone();} }
    function handle(e){
      switch(e.type){
        case 'hello': setStatus('online'); break;
        case 'busy': if(!e.busy)finalize(); break;
        case 'stream_token': streamed=true; cb&&cb.onToken&&cb.onToken(e.text||''); break;
        case 'tool_start': cb&&cb.onTool&&cb.onTool(e.name||'tool'); break;
        case 'log_event': if(e.event&&e.event.kind==='error')cb&&cb.onError&&cb.onError(e.event.text||'出错'); break;
        case 'final': case 'assistant_done': if(e.text&&!streamed)cb&&cb.onToken&&cb.onToken(e.text); finalize(); break;
        case 'error': cb&&cb.onError&&cb.onError(e.message||'错误'); finalize(); break;
      }
    }
    function connect(){
      setStatus('connecting');
      try{ws=new WebSocket(`${WS_BASE}?bot=${encodeURIComponent(bot)}&session=${SESSION}`);}
      catch(_){setStatus('offline');return;}
      ws.onopen=()=>{connected=true;retry=0;setStatus('online');};
      ws.onclose=()=>{connected=false;setStatus('offline');
        if(turn)cb&&cb.onError&&cb.onError('连接中断');finalize();
        retry++;setTimeout(connect,Math.min(1000*retry,6000));};
      ws.onerror=()=>setStatus('offline');
      ws.onmessage=ev=>{let e;try{e=JSON.parse(ev.data);}catch(_){return;}handle(e);};
    }
    return {
      connect(){connect();}, ready:()=>connected,
      send(text,callbacks){ cb=callbacks;
        if(!connected){callbacks.onError&&callbacks.onError('未连接，重连中…');return false;}
        streamed=false;turn=true;ws.send(JSON.stringify({type:'chat',text}));return true; },
      reset(){ if(connected)ws.send(JSON.stringify({type:'new_session'})); },
      bindStatus(fn){sub.onStatus=fn;}
    };
  }
  function Bot101SseAdapter(){
    const history=[];let sub={};
    return {
      connect(){sub.onStatus&&sub.onStatus('online');}, ready:()=>true,
      async send(text,cb){
        history.push({role:'user',content:text});let buf='';
        try{
          const resp=await fetch('/api/bot101/chat',{method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({messages:history,date:today(),stream:true})});
          if(!resp.ok||!resp.body)throw new Error('HTTP '+resp.status);
          const reader=resp.body.getReader(),dec=new TextDecoder();
          const dispatch=chunk=>{let e='message',data='';
            chunk.split('\n').forEach(line=>{line=line.replace(/\r$/,'');
              if(line.indexOf('event:')===0)e=line.slice(6).trim();
              else if(line.indexOf('data:')===0)data+=line.slice(5).replace(/^ /,'');});
            if(!data)return;let obj;try{obj=JSON.parse(data);}catch(_){return;}
            if(e==='token')cb.onToken&&cb.onToken(obj.text||'');
            else if(e==='tool_call')cb.onTool&&cb.onTool(obj.name||'?');
            else if(e==='tool_result')cb.onToolResult&&cb.onToolResult(obj.name||'?',!!obj.ok);
            else if(e==='done'){history.push({role:'assistant',content:obj.reply||''});cb.onDone&&cb.onDone();}
            else if(e==='error'){if(history.length&&history[history.length-1].role==='user')history.pop();cb.onError&&cb.onError(obj.error||'出错');}};
          for(;;){const r=await reader.read();if(r.done){if(buf.trim())dispatch(buf);break;}
            buf+=dec.decode(r.value,{stream:true});let i;
            while((i=buf.indexOf('\n\n'))>=0){dispatch(buf.slice(0,i));buf=buf.slice(i+2);}}
        }catch(err){if(history.length&&history[history.length-1].role==='user')history.pop();
          cb.onError&&cb.onError('网络错误：'+(err.message||err));}
        return true;
      },
      seed(msgs){for(const m of msgs)history.push(m);},
      reset(){history.length=0;}, bindStatus(fn){sub.onStatus=fn;}
    };
  }

  // ================= DOM =================
  const $=id=>document.getElementById(id);
  const wx=$('wx'),listEl=$('list'),scrollEl=$('scroll'),inputEl=$('input'),sendEl=$('send'),
        titleEl=$('title'),subEl=$('sub');
  function avHtml(av,color,cls){return `<div class="av ${cls||''}" style="background:${color}">${av}</div>`;}

  // ================= 每个 agent 一个控制器 =================
  let active=null;
  const controllers=AGENTS.map(meta=>{
    const adapter = meta.type==='ws' ? WsAgentAdapter(meta.bot) : Bot101SseAdapter();

    // 列表项
    const item=document.createElement('div');item.className='item';
    item.innerHTML=`${avHtml(meta.av,meta.color)}<span class="badge" style="display:none">0</span>
      <div class="it-main"><div class="it-top"><span class="it-name">${esc(meta.name)}</span><span class="it-time"></span></div>
      <div class="it-prev">${esc(meta.tag)}</div></div>`;
    const badge=item.querySelector('.badge'),avEl=item.querySelector('.av'),
          prevEl=item.querySelector('.it-prev'),timeEl=item.querySelector('.it-time');
    avEl.appendChild(badge);
    listEl.appendChild(item);

    // 消息面板
    const pane=document.createElement('div');pane.className='pane';
    pane.innerHTML=`<div class="sys intro">${meta.intro}<br><span style="opacity:.8">回答仅供内部研究参考，不构成投资建议</span></div>`;
    scrollEl.appendChild(pane);

    const ctl={
      meta,adapter,item,pane,
      online:false,busy:false,unread:0,draft:'',curAI:null,curText:'',log:loadLog(meta.id),
      setPreview(t,time){prevEl.textContent=plain(t).slice(0,30)||meta.tag;timeEl.textContent=time||hhmm();},
      bumpUnread(){ if(active!==ctl){ctl.unread++;badge.textContent=ctl.unread>99?'99+':ctl.unread;badge.style.display='';} },
      clearUnread(){ctl.unread=0;badge.style.display='none';}
    };

    function atBottom(){return scrollEl.scrollHeight-scrollEl.scrollTop-scrollEl.clientHeight<80;}
    function scroll(force){ if(active===ctl&&(force||atBottom()))scrollEl.scrollTop=scrollEl.scrollHeight; }
    function addRow(role){
      const row=document.createElement('div');row.className='row '+(role==='me'?'sent':'recv');
      const av=role==='me'?USER_AV:{av:meta.av,color:meta.color};
      row.innerHTML=`${avHtml(av.av,av.color)}<div class="bub${role==='me'?'':' md'}"></div>`;
      pane.appendChild(row);scroll(true);return row.querySelector('.bub');
    }
    function addSys(txt){const d=document.createElement('div');d.className='sys';d.textContent=txt;pane.appendChild(d);scroll();return d;}
    let lastSave=0;
    function streamSave(){ const now=Date.now(); if(now-lastSave<800)return; lastSave=now;
      saveLog(meta.id,ctl.log.concat([{t:'ai',text:ctl.curText,time:hhmm()}])); } // 流式中临时落盘：打到一半刷新也不丢
    function finishTurn(){
      if(ctl.curAI){const c=ctl.curAI.querySelector('.caret');if(c)c.remove();
        if(ctl.curText.trim()){
          const time=hhmm();
          ctl.log.push({t:'ai',text:ctl.curText,time});
          ctl.setPreview(ctl.curText,time);ctl.bumpUnread();
        }else if(!ctl.curAI.innerHTML.trim()){
          ctl.curAI.innerHTML='<span style="color:#9a9a9a">（无文本输出）</span>';
        }}
      saveLog(meta.id,ctl.log); // 收尾统一落盘，并清掉流式临时快照
      ctl.curAI=null;ctl.curText='';ctl.busy=false;refreshComposer();
    }
    const cb={
      onToken(t){ if(!ctl.curAI)ctl.curAI=addRow('ai'); ctl.curText+=t;
        ctl.curAI.innerHTML=md(ctl.curText)+'<span class="caret"></span>';scroll();streamSave(); },
      onTool(name){ addSys('⚙ 调用 '+name); },
      onToolResult(name,ok){ /* 列表里已有 ⚙ 行，结果用一条系统提示补充 */ if(!ok)addSys('✗ '+name+' 失败'); },
      onDone(){ finishTurn(); },
      onError(msg){ const b=ctl.curAI||addRow('ai'); b.innerHTML='<span class="err">⚠ '+esc(msg)+'</span>';
        ctl.curAI=b;finishTurn(); }
    };
    function setStatus(state){
      ctl.online=(state==='online');
      if(active===ctl)renderSub(ctl,state);
      refreshComposer();
    }
    adapter.bindStatus(setStatus);

    ctl.submit=function(text){
      const b=addRow('me');b.textContent=text;
      const time=hhmm();ctl.setPreview(text,time);
      ctl.log.push({t:'me',text,time});saveLog(meta.id,ctl.log);
      ctl.busy=true;refreshComposer();
      adapter.send(text,cb);
    };
    ctl.resetChat=function(){
      ctl.log=[];saveLog(meta.id,ctl.log);
      pane.innerHTML=`<div class="sys intro">${meta.intro}</div><div class="sys">已开启新对话</div>`;
      adapter.reset();prevEl.textContent=meta.tag;timeEl.textContent='';
    };
    // 恢复本地历史（刷新不丢）。bot21/22 服务端 hub 会话本就记得；bot101 无状态，需把历史回灌进适配器。
    if(ctl.log.length){
      const conv=ctl.log.filter(e=>e.t==='me'||e.t==='ai');
      conv.forEach(e=>{const b=addRow(e.t==='me'?'me':'ai');
        if(e.t==='ai')b.innerHTML=md(e.text);else b.textContent=e.text;});
      const last=conv[conv.length-1];
      if(last)ctl.setPreview(last.text,last.time);
      if(meta.type==='sse'&&adapter.seed)
        adapter.seed(conv.map(e=>({role:e.t==='me'?'user':'assistant',content:e.text})));
    }
    item.onclick=()=>switchTo(ctl);
    adapter.connect();
    return ctl;
  });

  function renderSub(ctl,state){
    titleEl.textContent=ctl.meta.name;
    const map={connecting:'连接中…',online:'',offline:'已断开 · 重连中…'};
    const s=state!==undefined?state:(ctl.online?'online':'offline');
    subEl.innerHTML=map[s]?('· '+esc(map[s])):('· '+esc(ctl.meta.tag));
  }
  function refreshComposer(){
    if(!active){sendEl.disabled=true;return;}
    const ready=active.online&&!active.busy&&inputEl.value.trim().length>0;
    sendEl.disabled=!(active.online&&!active.busy);
    sendEl.classList.toggle('ready',ready);
  }
  function switchTo(ctl){
    active=ctl;
    controllers.forEach(c=>{c.item.classList.toggle('sel',c===ctl);c.pane.classList.toggle('show',c===ctl);});
    ctl.clearUnread();
    renderSub(ctl);
    inputEl.value=ctl.draft||'';autosize();
    inputEl.placeholder='发消息给 '+ctl.meta.name.split('·').pop().trim();
    wx.classList.add('chatopen');
    refreshComposer();
    scrollEl.scrollTop=scrollEl.scrollHeight;
    if(window.innerWidth>760)inputEl.focus();
  }

  function submit(){
    if(!active)return;
    const text=inputEl.value.trim();
    if(!text||active.busy||!active.online)return;
    active.submit(text);
    active.draft='';inputEl.value='';autosize();refreshComposer();
  }
  function autosize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px';}

  sendEl.onclick=submit;
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}});
  inputEl.addEventListener('input',()=>{ if(active)active.draft=inputEl.value; autosize();refreshComposer(); });
  $('back').onclick=()=>wx.classList.remove('chatopen');
  $('newsess').onclick=()=>{ if(active)active.resetChat(); };
  $('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
    controllers.forEach(c=>{c.item.style.display=(!q||c.meta.name.toLowerCase().includes(q)||c.meta.tag.toLowerCase().includes(q))?'':'none';});});

  // ↑/↓ 切换会话。输入框写多行草稿时让方向键移动光标，不抢键。
  function navStep(dir){
    const vis=controllers.filter(c=>c.item.style.display!=='none');
    if(!vis.length)return;
    let i=vis.indexOf(active);
    if(i<0){switchTo(vis[0]);return;}
    const j=Math.max(0,Math.min(vis.length-1,i+dir));
    if(j!==i)switchTo(vis[j]);
  }
  document.addEventListener('keydown',e=>{
    if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
    if(e.target===inputEl&&inputEl.value.includes('\n'))return; // 多行草稿：交给光标
    e.preventDefault();
    navStep(e.key==='ArrowDown'?1:-1);
  });

  // 默认进入第一个会话（桌面端）；窄屏停在列表
  if(window.innerWidth>760)switchTo(controllers[0]);
  else{ active=controllers[0]; controllers[0].item.classList.add('sel'); controllers[0].pane.classList.add('show'); renderSub(controllers[0]); }
})();
</script>
</body>
</html>
