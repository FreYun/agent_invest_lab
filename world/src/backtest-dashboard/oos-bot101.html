<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOS bot101</title>
<style>
:root{--bg:#0b1020;--panel:#11182a;--panel2:#0f1524;--border:#22304b;--text:#e8edf7;--dim:#7d88a0;--accent:#66d9e8;--accent2:#ffb86b;--gain:#ff6b8a;--loss:#65d9a5;--radius:8px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,rgba(102,217,232,.07),transparent 20%),linear-gradient(135deg,rgba(255,184,107,.05),transparent 34%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;letter-spacing:0}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.45),transparent 85%)}.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.sub{color:var(--dim);font-size:13px;margin-top:6px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);text-decoration:none;border-radius:6px;padding:7px 11px;font-size:12px;cursor:pointer}.nav a:hover,.btn:hover{border-color:var(--accent)}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}.metric{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);padding:14px}.metric .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.metric .v{margin-top:8px;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}.metric .s{font-size:12px;color:var(--dim);margin-top:4px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,.9fr);gap:14px}.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:14px;margin-bottom:14px}.panel h2{margin:0 0 10px;font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}.chart{width:100%;height:auto;display:block;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}.axis{font-size:10px;fill:var(--dim)}.gridline{stroke:rgba(255,255,255,.06);stroke-width:1}.line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.area{fill:rgba(102,217,232,.12)}.baseline{stroke:rgba(255,184,107,.35);stroke-dasharray:4 4}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;font-size:12px;vertical-align:top}.table th{color:var(--dim);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:11px}.badge.buy{color:var(--gain)}.badge.sell{color:var(--loss)}.badge.pending{color:var(--accent2)}.badge.done{color:var(--loss)}.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:24px;color:var(--dim);text-align:center}.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.datebar select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px}.reports{display:flex;gap:8px;flex-wrap:wrap}.report-pill{border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;background:rgba(255,255,255,.03)}.report-pill strong{color:var(--accent)}.reason{color:var(--dim);font-size:12px;line-height:1.45;max-width:520px}@media(max-width:1050px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}@media(max-width:640px){.wrap{padding:14px}.summary{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><h1>OOS bot101</h1><div class="sub">固定 live run · oos-bot101-daily · 与回测 run 隔离展示</div></div><div class="nav"><a href="/">回测看板</a><a href="/market-reports.html">市场报告</a><button class="btn" id="refreshBtn">刷新</button></div></div>
  <div class="panel datebar"><label>交易日 <select id="dateSelect"></select></label><span id="runMeta" class="sub"></span></div>
  <div id="summary" class="summary"></div>
  <div class="layout"><main><div class="panel"><h2>账户净值曲线</h2><div id="chartRoot"></div></div><div class="panel"><h2>bot101 订单</h2><div id="ordersRoot"></div></div><div class="panel"><h2>已结算动作</h2><div id="actionsRoot"></div></div></main><aside><div class="panel"><h2>报告状态</h2><div id="reportsRoot"></div></div><div class="panel"><h2>当日持仓</h2><div id="positionsRoot"></div></div></aside></div>
</div>
<script>
const state={data:null}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmtMoney=v=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0}).format(Number(v||0))
const fmtPct=v=>v==null?'--':String(Number(v)>=0?'+':'')+Number(v).toFixed(2)+'%'
const fmtNav=v=>v==null?'--':Number(v).toFixed(4)
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function sideLabel(t){const x=String(t||'').toLowerCase();return x.includes('sell')?'卖':x.includes('buy')?'买':t||'--'}
function renderSummary(d){const s=d.snapshot||{};document.getElementById('summary').innerHTML=[['净值',fmtNav(s.net_value),'日期 '+(d.selectedDate||'--')],['总资产','¥'+fmtMoney(s.total_value),'固定 run_id'],['累计收益',fmtPct(s.cumulative_return_pct),'OOS live account'],['现金仓位',s.cash_weight==null?'--':(num(s.cash_weight)*100).toFixed(1)+'%','当日快照'],['订单数',String((d.orders||[]).length),String((d.actions||[]).length)+' 条已结算动作']].map(x=>'<div class="metric"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div><div class="s">'+esc(x[2])+'</div></div>').join('')}
function renderChart(series){if(!series||series.length<1)return'<div class="empty">没有净值曲线</div>';const w=900,h=300,p={l:48,r:18,t:18,b:34};const vals=series.map(x=>num(x.net_value)||1);let min=Math.min(...vals,1),max=Math.max(...vals,1);if(max-min<0.001){max+=0.01;min-=0.01}const x=i=>p.l+(w-p.l-p.r)*(series.length===1?0:i/(series.length-1));const y=v=>h-p.b-(h-p.t-p.b)*((v-min)/(max-min));const pts=series.map((r,i)=>x(i).toFixed(1)+','+y(num(r.net_value)||1).toFixed(1)).join(' ');const area=p.l+','+(h-p.b)+' '+pts+' '+x(series.length-1)+','+(h-p.b);const ticks=[min,(min+max)/2,max];return'<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img">'+ticks.map(t=>'<line class="gridline" x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y(t)+'" y2="'+y(t)+'"></line><text class="axis" x="8" y="'+(y(t)+4)+'">'+t.toFixed(3)+'</text>').join('')+'<line class="baseline" x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y(1)+'" y2="'+y(1)+'"></line><polygon class="area" points="'+area+'"></polygon><polyline class="line" points="'+pts+'"></polyline><text class="axis" x="'+p.l+'" y="'+(h-10)+'">'+esc(series[0].trade_date)+'</text><text class="axis" x="'+(w-p.r-70)+'" y="'+(h-10)+'">'+esc(series[series.length-1].trade_date)+'</text></svg>'}
function table(rows, heads, rowfn, empty){if(!rows.length)return'<div class="empty">'+empty+'</div>';return'<table class="table"><thead><tr>'+heads.map(h=>'<th'+(h.num?' class="num"':'')+'>'+esc(h.t)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(rowfn).join('')+'</tbody></table>'}
function renderOrders(rows){return table(rows,[{t:'日期'},{t:'动作'},{t:'基金'},{t:'金额',num:1},{t:'状态'},{t:'理由'}],r=>'<tr><td>'+esc(r.order_date)+'</td><td><span class="badge '+esc(r.order_type)+'">'+esc(sideLabel(r.order_type))+'</span></td><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+'</div></td><td class="num">¥'+fmtMoney(r.order_amount)+'</td><td><span class="badge '+esc(r.status)+'">'+esc(r.status)+'</span></td><td><div class="reason">'+esc(r.action_reason||'')+'</div></td></tr>','当天没有订单')}
function renderActions(rows){return table(rows,[{t:'日期'},{t:'动作'},{t:'基金'},{t:'金额',num:1},{t:'份额',num:1},{t:'理由'}],r=>'<tr><td>'+esc(r.action_date)+'</td><td><span class="badge">'+esc(r.action_type)+'</span></td><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+'</div></td><td class="num">¥'+fmtMoney(r.amount)+'</td><td class="num">'+fmtMoney(r.shares)+'</td><td><div class="reason">'+esc(r.reason||'')+'</div></td></tr>','当天没有已结算动作')}
function renderPositions(rows){return table(rows,[{t:'基金'},{t:'仓位',num:1},{t:'市值',num:1},{t:'份额',num:1}],r=>'<tr><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+(r.theme?' · '+esc(r.theme):'')+'</div></td><td class="num">'+(num(r.weight)*100).toFixed(2)+'%</td><td class="num">¥'+fmtMoney(r.market_value)+'</td><td class="num">'+fmtMoney(r.shares)+'</td></tr>','当天没有持仓快照')}
function renderReports(rows){if(!rows.length)return'<div class="empty">当天没有报告镜像</div>';return'<div class="reports">'+rows.map(r=>'<span class="report-pill"><strong>'+esc(r.report_type)+'</strong> · '+esc(r.as_of_date)+' · '+esc(r.chars)+' chars</span>').join('')+'</div>'}
function render(d){document.getElementById('runMeta').textContent='run_id='+d.runId+' · bot_id='+d.botId;const sel=document.getElementById('dateSelect');sel.innerHTML=(d.dates||[]).map(x=>'<option value="'+esc(x)+'"'+(x===d.selectedDate?' selected':'')+'>'+esc(x)+'</option>').join('');renderSummary(d);document.getElementById('chartRoot').innerHTML=renderChart(d.series);document.getElementById('ordersRoot').innerHTML=renderOrders(d.orders||[]);document.getElementById('actionsRoot').innerHTML=renderActions(d.actions||[]);document.getElementById('positionsRoot').innerHTML=renderPositions(d.positions||[]);document.getElementById('reportsRoot').innerHTML=renderReports(d.reports||[])}
function load(date){const url='/api/oos/bot101'+(date?'?date='+encodeURIComponent(date):'');fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{state.data=d;render(d)}).catch(e=>{document.getElementById('summary').innerHTML='<div class="empty">加载失败：'+esc(e.message||e)+'</div>'})}
document.getElementById('dateSelect').addEventListener('change',e=>load(e.target.value))
document.getElementById('refreshBtn').addEventListener('click',()=>load(state.data&&state.data.selectedDate))
load('')
</script>
</body>
</html>
