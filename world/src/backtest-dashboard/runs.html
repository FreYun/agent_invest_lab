  if (tr){ const rec = records.find(r => r._key === tr.dataset.key); if (rec){ state.groupSel[rec._ix] = rec._key; render() } return }
})
// 组内候选 run 排序：完成且卡玛最高 → 其它有卡玛的 → 无卡玛按回测最长。去重保序。
// 默认展示走这个顺序的第一个能拉到数据的 run（有些 CSV 里的 run 已不在 fund.db，需跳过）。
function groupCandidates(grpAll){
  const grp = grpAll.filter(isPass)   // 不合格 run 不进图表展示/排序队列
  const withCal = grp.filter(r => r._calmar != null)
  const completed = withCal.filter(r => r['状态'] === '完成').sort((a, b) => b._calmar - a._calmar)
  const otherCal = withCal.filter(r => r['状态'] !== '完成').sort((a, b) => b._calmar - a._calmar)
  const noCal = grp.filter(r => r._calmar == null).sort((a, b) => (num(b['回测月数']) || 0) - (num(a['回测月数']) || 0))
  const seen = new Set(), out = []
  for (const r of [...completed, ...otherCal, ...noCal]){ if (seen.has(r._key)) continue; seen.add(r._key); out.push(r) }
  return out
}
async function fetchBot(rec){
  if (botCache.has(rec._key)) return botCache.get(rec._key)
  let bot = null
  try {
    const r = await fetch(`/api/backtest/bot?bot_id=${encodeURIComponent(rec['bot'])}&run_id=${encodeURIComponent(rec['run_id'])}`, { cache: 'no-store' })
    if (r.ok) bot = await r.json()
  } catch { /* 失败回退/提示 */ }
  botCache.set(rec._key, bot)   // 缓存结果（含 null，避免反复重拉打不到的 run）
  return bot
}
function highlightBlockRow(panel, ix){
  const block = panel.closest('.index-block'); if (!block) return
  const key = state.groupShown[ix]
  block.querySelectorAll('tr[data-key]').forEach(tr => tr.classList.toggle('selected', tr.dataset.key === key))
}
// 渲染某指数区块的图。userKey 指定时只认那一条（用户点选，拉不到就显错）；否则按候选顺序
// 逐个尝试，第一个能拉到净值的就展示——保证每个指数尽量都有图。
async function renderGroupChart(panel, grp, ix){
  if (!panel) return
  const userKey = state.groupSel[ix]
  const cands = userKey ? grp.filter(r => r._key === userKey) : groupCandidates(grp)
  if (!cands.length){ panel.innerHTML = '<div class="empty">本组暂无合格 run 可画图（不合格 run 不进图表队列）</div>'; syncBlockHeights(); return }
  const token = panel.dataset.token = String((Number(panel.dataset.token) || 0) + 1)
  panel.innerHTML = chartHead(cands[0], null, '<div class="empty">加载净值数据…</div>')
  for (const rec of cands){
    const bot = await fetchBot(rec)
    if (panel.dataset.token !== token) return   // 期间又触发了 render
    if (bot && (bot.series || []).length >= 2){
      state.groupShown[ix] = rec._key; highlightBlockRow(panel, ix)
      renderChartInto(panel, rec, bot); syncBlockHeights(); return
    }
  }
  state.groupShown[ix] = cands[0]._key; highlightBlockRow(panel, ix)
  panel.innerHTML = chartHead(cands[0], null, '<div class="empty">该指数的 run 在 fund.db 中暂无可画的净值数据（已隐藏/重建/无成交）</div>')
  syncBlockHeights()
}
// 让每个指数区块的左侧表格高度对齐右侧净值图：超出右图高度的行进入纵向滚动（窄屏单列时不限高）。
function syncBlockHeights(){
  const stacked = window.matchMedia('(max-width:1180px)').matches
  document.querySelectorAll('.index-block').forEach(block => {
    const scroll = block.querySelector('.ix-left .table-scroll')
    if (!scroll) return
    if (stacked){ scroll.style.maxHeight = ''; return }
    const right = block.querySelector('.ix-right')
    const head = block.querySelector('.ix-left .index-head')
    const rightH = right ? right.offsetHeight : 0
    if (!rightH){ scroll.style.maxHeight = ''; return }
    const headH = head ? head.offsetHeight : 0
    scroll.style.maxHeight = Math.max(160, rightH - headH - 8) + 'px'  // 8 = index-head 下边距
  })
}
window.addEventListener('resize', syncBlockHeights)

// ---- 右侧净值图：模仿 dashboard（净值线 + 基准线 + 买卖点），数据来自 /api/backtest/bot ----
function fmtNav(v){ return v == null ? '--' : Number(v).toFixed(4) }
// 仓位堆叠配色（与主看板 index.html 一致，同基金跨图同色）
const STACK_PALETTE = ['#6cd0ea', '#c084fc', '#f59e0b', '#22c55e', '#ef4444', '#fb923c', '#a78bfa', '#14b8a6']
function fundColor(fundCode){
  let h = 0; const s = String(fundCode || '')
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0
  return STACK_PALETTE[h % STACK_PALETTE.length]
}
// 把逐日持仓 {date:[{fund_code,fund_name,weight}]} 转成堆叠带（按最大权重降序，累加得 lower/upper）
function buildStackBands(holdingsByDate, dates){
  const meta = new Map()
  for (const d of dates){
    for (const h of holdingsByDate[d] || []){
      const w = Number(h.weight || 0); const cur = meta.get(h.fund_code)
      if (!cur) meta.set(h.fund_code, { fund_name: h.fund_name, maxWeight: w })
      else if (w > cur.maxWeight) cur.maxWeight = w
    }
  }
  const ordered = [...meta.entries()].sort((a, b) => b[1].maxWeight - a[1].maxWeight || a[0].localeCompare(b[0]))
  const bands = ordered.map(([fund_code, m]) => ({ fund_code, fund_name: m.fund_name, lower: new Array(dates.length).fill(0), upper: new Array(dates.length).fill(0) }))
  for (let i = 0; i < dates.length; i++){
    const byCode = new Map(); for (const h of holdingsByDate[dates[i]] || []) byCode.set(h.fund_code, Number(h.weight || 0))
    let cum = 0
    for (const band of bands){ band.lower[i] = cum; cum += byCode.get(band.fund_code) || 0; band.upper[i] = cum }
  }
  return bands
}
// 「总仓位」堆叠面积子图。W/pad.l/pad.r 与 NAV 图一致 → x 精确对齐；xAxis 用窗口内并集日期。
function renderPosChart(bot, xAxis){
  const hbd = bot.holdingsByDate || {}
  if (!xAxis.length || !Object.keys(hbd).length) return { html: '', hasPos: false }
  const bands = buildStackBands(hbd, xAxis)
  const totalUpper = bands.length ? bands[bands.length - 1].upper : []
  if (!totalUpper.some(v => v > 1e-6)) return { html: '', hasPos: false }   // 全程空仓 → 不画
  const W = 496, H = 64, pad = { l: 44, r: 12, t: 6, b: 14 }
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b
  const xs = xAxis.map((_, i) => pad.l + (xAxis.length <= 1 ? innerW / 2 : innerW * (i / (xAxis.length - 1))))
  const yFor = w => H - pad.b - innerH * Math.max(0, Math.min(1, w))
  let bandsSvg
  if (bands.length <= 1){
    const upper = bands.length ? bands[0].upper : xAxis.map(() => 0)
    const pts = xAxis.map((_, i) => `${xs[i].toFixed(1)} ${yFor(upper[i]).toFixed(1)}`).join(' L')
    const area = `M${xs[0].toFixed(1)} ${yFor(0).toFixed(1)} L${pts} L${xs[xAxis.length - 1].toFixed(1)} ${yFor(0).toFixed(1)} Z`
    bandsSvg = `<path d="${area}" fill="rgba(192,132,252,.18)"></path><path d="${area.replace(/ Z$/, '')}" fill="none" stroke="#c084fc" stroke-width="1.4"></path>`
  } else {
    bandsSvg = bands.map(b => {
      const up = xAxis.map((_, i) => `${xs[i].toFixed(1)} ${yFor(b.upper[i]).toFixed(1)}`).join(' L')
      const lo = xAxis.map((_, i) => `${xs[xAxis.length - 1 - i].toFixed(1)} ${yFor(b.lower[xAxis.length - 1 - i]).toFixed(1)}`).join(' L')
      return `<path d="M${up} L${lo} Z" fill="${fundColor(b.fund_code)}" fill-opacity=".78"></path>`
    }).join('')
  }
  const yTicks = [0, 0.5, 1].map(w => { const y = yFor(w)
    return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}" class="cp-grid"></line><text x="6" y="${(y + 3).toFixed(1)}" class="cp-axis">${(w * 100).toFixed(0)}%</text>` }).join('')
  const topPath = `M${xs[0].toFixed(1)} ${yFor(totalUpper[0]).toFixed(1)} ` + xAxis.map((_, i) => `L${xs[i].toFixed(1)} ${yFor(totalUpper[i]).toFixed(1)}`).join(' ')
  const legend = bands.length > 1
    ? `<div class="cp-pos-legend">` + bands.map(b => `<span class="cp-pos-lg"><span class="cp-pos-sw" style="background:${fundColor(b.fund_code)}"></span>${esc(b.fund_code)} ${esc(b.fund_name || '')}</span>`).join('') + `</div>`
    : ''
  const svg = `<div class="cp-pos-title">总仓位</div><svg class="cp-pos-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + yTicks + bandsSvg
    + `<path d="${topPath}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"></path>`
    + `<line class="cp-pos-cursor-line" y1="${pad.t}" y2="${H - pad.b}" style="display:none"></line></svg>` + legend
  return { html: svg, hasPos: true }
}
function chartLine(points, dToI, axisLen, yMin, yMax, W, H, pad){
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b, span = Math.max(yMax - yMin, 1e-4)
  const xs = [], ys = []
  for (const p of points){
    const idx = dToI.get(p.trade_date); if (idx == null) continue
    const x = pad.l + (axisLen <= 1 ? innerW / 2 : innerW * (idx / (axisLen - 1)))
    const y = H - pad.b - innerH * ((Number(p.net_value || 1) - yMin) / span)
    xs.push(x); ys.push(y)
  }
  const d = xs.map((x, i) => `${i ? 'L' : 'M'} ${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(' ')
  const area = xs.length ? `${d} L ${xs[xs.length - 1].toFixed(1)} ${H - pad.b} L ${xs[0].toFixed(1)} ${H - pad.b} Z` : ''
  return { d, area, xs, ys }
}
// 时间窗口预设：key → [标签, 天数]（all=全部）。天数按自然日往前推。
const WIN_PRESETS = [['all', '全部', 0], ['1y', '近1年', 366], ['6m', '近半年', 183], ['3m', '近3月', 92], ['1m', '近1月', 31]]
// 给定升序日期数组与窗口 key，返回裁剪起始日（含）；all 或数据不足时返回最早日。
function windowCut(dates, win){
  if (!dates.length) return null
  if (win === 'all') return dates[0]
  const preset = WIN_PRESETS.find(p => p[0] === win)
  if (!preset || !preset[2]) return dates[0]
  const end = new Date(dates[dates.length - 1] + 'T00:00:00Z')
  end.setUTCDate(end.getUTCDate() - preset[2])
  const cut = end.toISOString().slice(0, 10)
  return cut < dates[0] ? dates[0] : cut
}
// 全序列日期跨度（自然日），用于禁用超出数据范围的窗口按钮
function spanDays(dates){
  if (dates.length < 2) return 0
  return Math.round((new Date(dates[dates.length - 1] + 'T00:00:00') - new Date(dates[0] + 'T00:00:00')) / 86400000)
}
// 返回 { html, geom }。win 为窗口 key（默认 'all'）。geom 供十字光标使用。
function renderChartBody(bot, win){
  win = win || 'all'
  const W = 496, H = 300, pad = { l: 44, r: 12, t: 14, b: 30 }
  const fullSeries = bot.series || []
  if (fullSeries.length < 2) return { html: '<div class="empty">该 run 无净值序列数据</div>', geom: null }
  const bench = bot.benchmark, fullBSeries = (bench && bench.series) || []
  // 用全序列日期算跨度决定按钮可用性；再按窗口裁剪 series/bench/actions
  const fullDates = [...new Set([...fullSeries, ...fullBSeries].map(p => p.trade_date))].sort()
  const totalSpan = spanDays(fullDates)
  const wp = WIN_PRESETS.find(p => p[0] === win)
  if (win !== 'all' && wp && wp[2] >= totalSpan) win = 'all'   // 记忆的窗口≥全程 → 归一到「全部」，避免禁用按钮却处于选中态
  let cut = windowCut(fullDates, win)
  let series = fullSeries.filter(p => p.trade_date >= cut)
  if (series.length < 2){ series = fullSeries; cut = fullDates[0]; win = 'all' }  // 窗口太窄 → 回退全程
  const bSeries = fullBSeries.filter(p => p.trade_date >= cut)
  const actions = (bot.actions || []).filter(a => !a.action_date || a.action_date >= cut)
  const winBtns = `<div class="cp-win">` + WIN_PRESETS.map(([k, label, days]) => {
      const disabled = k !== 'all' && days >= totalSpan   // 窗口≥全程 → 与「全部」等价，禁用
      return `<button data-win="${k}"${k === win ? ' class="active"' : ''}${disabled ? ' disabled' : ''}>${label}</button>`
    }).join('') + `</div>`
  const dateSet = new Set(series.map(p => p.trade_date)); for (const p of bSeries) dateSet.add(p.trade_date)
  const xAxis = [...dateSet].sort(); const dToI = new Map(xAxis.map((d, i) => [d, i]))
  const vals = [...series.map(p => Number(p.net_value || 1)), ...bSeries.map(p => Number(p.net_value || 1))]
  const yMin = Math.min(...vals), yMax = Math.max(...vals)
  const botC = chartLine(series, dToI, xAxis.length, yMin, yMax, W, H, pad)
  const benchC = bSeries.length ? chartLine(bSeries, dToI, xAxis.length, yMin, yMax, W, H, pad) : null
  // 光标几何：bot 各点 {date,x,y,nav}；基准按日期查 {x,y,nav}
  const geom = { W, H, pad, pts: series.map((p, i) => ({ date: p.trade_date, x: botC.xs[i], y: botC.ys[i], nav: Number(p.net_value || 1) })), benchByDate: new Map() }
  if (benchC) bSeries.forEach((p, i) => geom.benchByDate.set(p.trade_date, { x: benchC.xs[i], y: benchC.ys[i], nav: Number(p.net_value || 1) }))
  // 买卖点：同日同方向合并成一个标记，锚在 bot 当日净值点上
  const innerW = W - pad.l - pad.r
  const seriesIdxByDate = new Map(series.map((p, i) => [p.trade_date, i]))
  const firstAxisIdx = dToI.get(series[0].trade_date)
  const groups = new Map()
  for (const a of actions){
    if (a.side !== 'buy' && a.side !== 'sell') continue
    const key = `${a.action_date}|${a.side}`; let g = groups.get(key)
    if (!g){
      let x, y; const si = seriesIdxByDate.get(a.action_date)
      if (si != null){ x = botC.xs[si]; y = botC.ys[si] }
      else { const ai = dToI.get(a.action_date); if (ai == null) continue
        x = pad.l + (xAxis.length <= 1 ? innerW / 2 : innerW * (ai / (xAxis.length - 1)))
        y = botC.ys[(firstAxisIdx != null && ai < firstAxisIdx) ? 0 : series.length - 1] }
      g = { date: a.action_date, side: a.side, x, y, count: 0, amount: 0, funds: [] }; groups.set(key, g)
    }
    g.count++; g.amount += Number(a.amount || 0)
    if (a.fund_name && !g.funds.includes(a.fund_name)) g.funds.push(a.fund_name)
  }
  const sidesByDate = new Map()
  for (const g of groups.values()){ if (!sidesByDate.has(g.date)) sidesByDate.set(g.date, new Set()); sidesByDate.get(g.date).add(g.side) }
  const ticks = 4
  const yt = Array.from({ length: ticks }, (_, i) => yMin + (yMax - yMin) * (i / (ticks - 1)))
  const xl = series.filter((_, i) => i === 0 || i === series.length - 1 || i % Math.ceil(series.length / 4) === 0)
  const fmtMoney = v => new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 }).format(Number(v || 0))
  const legend = `<div class="cp-legend"><span class="cp-lg"><span class="cp-sw" style="background:var(--accent)"></span>${esc(bot.botId)} 净值</span>`
    + (bench ? `<span class="cp-lg"><span class="cp-sw" style="background:var(--accent2)"></span>基准 ${esc(bench.fundName || bench.fundCode || '')}</span>` : '')
    + `<span class="cp-lg"><span style="color:var(--gain)">▲ 买</span> <span style="color:var(--loss)">▼ 卖</span></span></div>`
  const svg = `<svg class="cp-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`
    + `<defs><linearGradient id="cpGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="rgba(102,217,232,.26)"/><stop offset="100%" stop-color="rgba(102,217,232,.02)"/></linearGradient></defs>`
    + yt.map(v => { const y = H - pad.b - (H - pad.t - pad.b) * ((v - yMin) / Math.max(yMax - yMin, 1e-4))
        return `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}" class="cp-grid"></line><text x="6" y="${(y + 3).toFixed(1)}" class="cp-axis">${fmtNav(v)}</text>` }).join('')
    + `<path d="${botC.area}" fill="url(#cpGrad)"></path>`
    + `<path d="${botC.d}" class="cp-line"></path>`
    + (benchC ? `<path d="${benchC.d}" class="cp-bench"></path>` : '')
    + [...groups.values()].map(m => {
        const both = (sidesByDate.get(m.date)?.size || 0) > 1
        const cy = both ? (m.side === 'sell' ? m.y - 5 : m.y + 5) : m.y
        const cls = m.side === 'sell' ? 'cp-mk-sell' : 'cp-mk-buy'
        const ct = m.count > 1 ? ` ${m.count}笔` : ''
        const title = `${m.date} ${m.side === 'sell' ? '卖出' : '买入'}${ct} ¥${fmtMoney(m.amount)}${m.funds.length ? ' ' + m.funds.join('、') : ''}`
        return `<g><circle cx="${m.x.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.6" class="${cls}"></circle><title>${esc(title)}</title></g>`
      }).join('')
    + xl.map(p => { const idx = dToI.get(p.trade_date); if (idx == null) return ''
        const x = pad.l + (xAxis.length <= 1 ? innerW / 2 : innerW * (idx / (xAxis.length - 1)))
        return `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" class="cp-axis">${esc(p.trade_date)}</text>` }).join('')
    + `<g class="cp-cursor" style="display:none"><line class="cp-cursor-line" y1="${pad.t}" y2="${H - pad.b}"></line>`
    + `<circle class="cp-cursor-dot cp-cursor-bench" r="4" style="display:none"></circle>`
    + `<circle class="cp-cursor-dot cp-cursor-bot" r="4.5"></circle></g>`
    + `</svg>`
  const pos = renderPosChart(bot, xAxis)   // 总仓位堆叠子图（同一窗口 xAxis，x 与 NAV 图对齐）
  const html = winBtns + legend + `<div class="cp-chart-wrap">` + svg + pos.html + `<div class="cp-tooltip" hidden></div></div>`
  return { html, geom }
}
// 渲染某 panel 的图表头+图体，并绑定窗口按钮与十字光标。win 缺省用 panel 记忆的窗口。
function renderChartInto(panel, rec, bot, win){
  win = win || panel._win || 'all'
  panel._chart = { rec, bot }; panel._win = win
  const { html, geom } = renderChartBody(bot, win)
  panel.innerHTML = chartHead(rec, bot, html)
  wireChart(panel, rec, bot, geom)
  // 决策流水表已挪到左侧「今日决策」定高窗内（fillOneDecPane），右侧只留净值图+指标。
}
// 绑定：① 窗口按钮点击→切窗重绘；② 图上 mousemove→吸附最近交易日、移动准星、更新浮层
function wireChart(panel, rec, bot, geom){
  const expandBtn = panel.querySelector('.cp-expand')
  if (expandBtn) expandBtn.addEventListener('click', () => openMethodologyModal(rec, bot))
  const winBar = panel.querySelector('.cp-win')
  if (winBar) winBar.addEventListener('click', e => {
    const b = e.target.closest('button[data-win]'); if (!b || b.disabled || b.classList.contains('active')) return
    renderChartInto(panel, rec, bot, b.dataset.win); syncBlockHeights()
  })
  wireChartCursor(panel, geom, bot)
}
// 十字光标绑定（可复用）：root 为含 .cp-chart / .cp-chart-wrap 的容器；mousemove 吸附最近交易日、移动准星、更新浮层
function wireChartCursor(root, geom, bot){
  const svg = root.querySelector('.cp-chart'), wrap = root.querySelector('.cp-chart-wrap')
  if (!svg || !wrap || !geom || !geom.pts.length) return
  const cursor = svg.querySelector('.cp-cursor'), tip = wrap.querySelector('.cp-tooltip')
  const line = cursor.querySelector('.cp-cursor-line')
  const botDot = cursor.querySelector('.cp-cursor-bot'), benchDot = cursor.querySelector('.cp-cursor-bench')
  const posLine = wrap.querySelector('.cp-pos-cursor-line')   // 仓位子图同步竖线（可能无）
  const hbd = bot.holdingsByDate || {}, hasPos = Object.keys(hbd).length > 0
  const move = ev => {
    const rect = svg.getBoundingClientRect(); if (!rect.width) return   // NAV 与仓位子图同宽同左边，用 NAV rect 映射即可
    const vbX = ((ev.clientX - rect.left) / rect.width) * geom.W
    let best = geom.pts[0], bd = Infinity
    for (const p of geom.pts){ const d = Math.abs(p.x - vbX); if (d < bd){ bd = d; best = p } }
    cursor.style.display = ''
    line.setAttribute('x1', best.x.toFixed(1)); line.setAttribute('x2', best.x.toFixed(1))
    botDot.setAttribute('cx', best.x.toFixed(1)); botDot.setAttribute('cy', best.y.toFixed(1))
    const bp = geom.benchByDate.get(best.date)
    if (bp){ benchDot.style.display = ''; benchDot.setAttribute('cx', best.x.toFixed(1)); benchDot.setAttribute('cy', bp.y.toFixed(1)) }
    else benchDot.style.display = 'none'
    if (posLine){ posLine.style.display = ''; posLine.setAttribute('x1', best.x.toFixed(1)); posLine.setAttribute('x2', best.x.toFixed(1)) }
    let posHtml = ''
    if (hasPos){
      const day = hbd[best.date] || []
      const totalPos = day.reduce((s, h) => s + (Number(h.weight) || 0), 0)
      posHtml = `<div class="tt-row tt-total"><span class="tt-k"><i style="background:#c084fc"></i>总仓位</span><span class="tt-v">${(totalPos * 100).toFixed(1)}%</span></div>`
        + [...day].sort((a, b) => (Number(b.weight) || 0) - (Number(a.weight) || 0)).slice(0, 5)
            .map(h => `<div class="tt-row tt-sub"><span class="tt-k"><i style="background:${fundColor(h.fund_code)}"></i>${esc(h.fund_code)}</span><span class="tt-v">${((Number(h.weight) || 0) * 100).toFixed(1)}%</span></div>`).join('')
    }
    tip.hidden = false
    tip.innerHTML = `<div class="tt-date">${esc(best.date)}</div>`
      + `<div class="tt-row"><span class="tt-k"><i style="background:var(--accent)"></i>净值</span><span class="tt-v">${best.nav.toFixed(4)}</span></div>`
      + (bp ? `<div class="tt-row"><span class="tt-k"><i style="background:var(--accent2)"></i>基准</span><span class="tt-v">${bp.nav.toFixed(4)}</span></div>` : '')
      + posHtml
    const leftPx = (best.x / geom.W) * rect.width, tw = tip.offsetWidth
    let tl = leftPx + 12; if (tl + tw > rect.width) tl = leftPx - tw - 12
    tip.style.left = Math.max(2, tl) + 'px'; tip.style.top = '6px'
  }
  wrap.addEventListener('mousemove', move)
  wrap.addEventListener('mouseleave', () => { cursor.style.display = 'none'; if (posLine) posLine.style.display = 'none'; tip.hidden = true })
}
// 从任意日度净值序列算风险调整指标：夏普（rf=0，年化×√252）+ 年化波动 + 年化收益 + 最大回撤 + 卡玛（带符号）
function navStats(points){
  const s = (points || []).filter(p => p && p.net_value != null)
  if (s.length < 3) return null
  const nv = s.map(p => Number(p.net_value) || 1)
  const rets = []
  for (let i = 1; i < nv.length; i++){ if (nv[i-1] > 0) rets.push(nv[i] / nv[i-1] - 1) }
  if (rets.length < 2) return null
  const mean = rets.reduce((a, b) => a + b, 0) / rets.length
  const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / (rets.length - 1)
  const sd = Math.sqrt(variance)
  const Y = 252
  const sharpe = sd > 0 ? mean / sd * Math.sqrt(Y) : null
  const annVol = sd * Math.sqrt(Y) * 100
  const annRet = (Math.pow(nv[nv.length-1] / nv[0], Y / rets.length) - 1) * 100
  let peak = nv[0], mdd = 0
  for (const v of nv){ if (v > peak) peak = v; const dd = v / peak - 1; if (dd < mdd) mdd = dd }
  const maxDD = mdd * 100
  const calmar = maxDD < 0 ? annRet / Math.abs(maxDD) : null   // 带符号，便于与基准相减
  return { sharpe, annVol, annRet, maxDD, calmar }
}
// 图下方两排：① 绝对（夏普/卡玛/年化波动/年化收益）② 相对躺平（相对卡玛/相对夏普/相对回撤，= bot − 被动满仓基准）
function statsHtml(rec, bot){
  const bs = navStats(bot.series)                                   // bot 自身
  const ms = bot.benchmark ? navStats(bot.benchmark.series) : null  // 躺平 = 被动满仓基准
  const sharpe = bs ? bs.sharpe : null
  const annVol = bs ? bs.annVol : null
  const annRet = num(rec['年化收益%']) ?? (bs ? bs.annRet : null)
  const calmar = rec._calmar ?? (bs && bs.calmar != null && bs.calmar > 0 ? bs.calmar : null)
  // 相对指标：仅在 bot 与基准两侧都可算时给值，否则 —
  const relSharpe = (bs && ms && bs.sharpe != null && ms.sharpe != null) ? bs.sharpe - ms.sharpe : null
  const relCalmar = (bs && ms && bs.calmar != null && ms.calmar != null) ? bs.calmar - ms.calmar : null
  const botDD = bs ? bs.maxDD : num(rec['最大回撤%'])
  const relDD = (botDD != null && ms && ms.maxDD != null) ? botDD - ms.maxDD : null   // 正=回撤比躺平浅（好）
  const sp = (n, d = 1) => n == null ? '—' : `${n > 0 ? '+' : ''}${n.toFixed(d)}%`
  const sg = (n, d = 2) => n == null ? '—' : `${n > 0 ? '+' : ''}${n.toFixed(d)}`
  const col = n => n == null ? 'flat' : n > 0 ? 'gain' : n < 0 ? 'loss' : 'flat'
  const tile = (k, v, cls = 'flat', title = '') => `<div class="cp-stat"${title ? ` title="${esc(title)}"` : ''}><div class="cp-stat-k">${k}</div><div class="cp-stat-v ${cls}">${v}</div></div>`
  const REL = '相对「躺平」(被动满仓基准)：bot − 基准，正=优于躺平'
  return `<div class="cp-stats">`
    + tile('夏普', sharpe == null ? '—' : sharpe.toFixed(2), sharpe == null ? 'flat' : sharpe >= 1 ? 'gain' : sharpe < 0 ? 'loss' : 'flat')
    + tile('卡玛', calmar == null ? '—' : calmar.toFixed(2), calmar == null ? 'flat' : calmar >= 1 ? 'gain' : 'flat')
    + tile('年化波动', annVol == null ? '—' : annVol.toFixed(1) + '%', 'flat')
    + tile('年化收益', sp(annRet), col(annRet))
    + tile('相对卡玛', sg(relCalmar), col(relCalmar), REL)
    + tile('相对夏普', sg(relSharpe), col(relSharpe), REL)
    + tile('相对回撤', relDD == null ? '—' : `${relDD > 0 ? '+' : ''}${relDD.toFixed(1)}pp`, col(relDD), REL + '（正=你回撤更浅）')
    + `</div>`
}
function chartHead(rec, bot, bodyHtml){
  const worldUrl = `${WORLD_BASE}?run=${encodeURIComponent(rec['run_id'])}&bot=${encodeURIComponent(rec['bot'])}`
  let pills = ''
  if (bot){
    const cr = Number(bot.cumulativeReturnPct), dd = Number(bot.maxDrawdownPct)
    const crC = cr > 0 ? 'var(--gain)' : cr < 0 ? 'var(--loss)' : 'inherit'
    const pass = isPass(rec)
    pills = `<div class="cp-pills">`
      + `<span class="cp-pill">累计收益 <strong style="color:${crC}">${cr>0?'+':''}${cr.toFixed(1)}%</strong></span>`
      + `<span class="cp-pill">最大回撤 <strong style="color:var(--loss)">${dd.toFixed(1)}%</strong></span>`
      + `<span class="cp-pill">卡玛 <strong>${rec._calmar==null?'—':rec._calmar.toFixed(2)}</strong></span>`
      + `<span class="cp-pill">买 ${bot.buyCount ?? '?'} · 卖 ${bot.sellCount ?? '?'}</span>`
      + `<span class="cp-pill ${pass?'pass':'fail'}">${pass?'✓ 合格':'✕ 不合格'}</span>`
      + `</div>`
  }
  const expandBtn = bot ? `<button class="cp-expand" data-expand title="展开：方法论进化 + 当日反思">⛶</button>` : ''
  return `<div class="cp-head"><div class="cp-title">${esc(rec['bot'])} · ${esc(rec._ixName)}${expandBtn}</div>`
    + `<div class="cp-sub">${esc(rec['对标指数'])} · <span class="run-id">${esc(rec['run_id'])}</span></div>`
    + `<a class="world-link" href="${esc(worldUrl)}" target="_blank" rel="noopener" title="在 world 页面打开此 run（新标签）">在 /world 打开此 run →</a></div>`
    + pills + bodyHtml + (bot ? statsHtml(rec, bot) : '')
}

// 启动：先从服务器拉「合格/不合格」覆盖（全员共享），再渲染。
// 旧版标记存在浏览器 localStorage（per-browser、互不可见）；首启且服务器为空时一次性迁移上去。
async function loadVerdicts(){
  let legacy = {}
  try { legacy = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {} } catch { legacy = {} }
  try {
    const r = await fetch('/api/backtest/run-verdicts', { cache: 'no-store' })
    if (r.ok) overrides = (await r.json()).verdicts || {}
    // 服务器为空 + 本地有旧标记 → 一次性迁移（mode:init 仅空时写、幂等，迁移后服务器即非空，不再触发）
    if (!Object.keys(overrides).length && Object.keys(legacy).length){
      const mr = await fetch('/api/backtest/run-verdicts/bulk', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ verdicts: legacy, mode: 'init' }),
      })
      if (mr.ok) overrides = (await mr.json()).verdicts || overrides
    }
  } catch {
    overrides = legacy   // 服务器不可达 → 用本地旧值降级渲染（不回写）
  }
}

void (async () => {

function closeMethodologyModal(){
  const m = document.getElementById('mdlModal')
  m.classList.remove('open'); m.querySelector('.mdl-body').innerHTML = ''

    + `<div class="mdl-grid">`
    +   `<div class="mdl-chart"></div>`
    +   `<div class="mdl-sec" id="mdlRfl"><h3>当日反思</h3><div class="mdl-empty">加载中…</div></div>`
    + `</div>`
    + `<div class="mdl-sec mdl-meth" id="mdlMeth"><h3>📐 方法论进化</h3><div class="mdl-empty">加载中…</div></div>`
  // 放大净值图：复用现有 body 渲染，并接上十字光标 + 窗口切换

  const rflEl = body.querySelector('#mdlRfl')
  // 右侧反思窗格高度对齐左侧(走势图+仓位)：布局稳定后量取图块高度写到反思容器上
  const syncRflHeight = () => { const h = chartEl.offsetHeight; if (h) rflEl.style.height = h + 'px' }
  const drawChart = win => {
    const { html, geom } = renderChartBody(bot, win)

  m.classList.add('open')
  // 懒加载方法论与反思（Task 4 / Task 5 填充）

  mountReflection(rflEl, bot)

// 纯函数：渲染方法论进化数据
function renderMethodologyHtml(d){
  const initHead = '初始版' + (d.strategyTitle ? ` · ${esc(d.strategyTitle)}` : '') + (d.strategyId ? `（${esc(d.strategyId)}）` : '')
  let timeline = `<ul class="mtl"><li><div class="mtl-hd"><b>${initHead}</b></div>`
    + `<div class="mtl-reason mdl-empty">agent 启动时被注入的方法论（全文见下）。</div></li>`
  if (d.revised && d.revisions.length){
    d.revisions.forEach((r, i) => {
      const size = (r.prior_size != null && r.new_size != null) ? `正文 ${r.prior_size}→${r.new_size} 字` : ''
      timeline += `<li><div class="mtl-hd"><b>${esc(r.ts || '—')}</b> · 第 ${i + 1} 次修订${size ? ' · ' + size : ''}</div>`
        + `<div class="mtl-reason">${esc(r.reason || '（无理由）')}</div></li>`
    })
  } else {
    timeline += `<li><div class="mtl-reason mdl-empty">本 run 未改动方法论。</div></li>`
  }
  timeline += `</ul>`
  const initFull = d.initial != null
    ? `<details class="mdl-details"><summary>初始方法论全文</summary><div class="mdl-full">${mdLite(d.initial)}</div></details>`
    : `<div class="mdl-empty">初始方法论快照不可用（旧 run 或无冻结策略库）。</div>`
  const latestFull = d.latest != null
    ? `<details class="mdl-details"><summary>最新方法论全文${d.revised ? '' : '（与初始一致）'}</summary><div class="mdl-full">${mdLite(d.latest)}</div></details>`
    : `<div class="mdl-empty">最新方法论不可用。</div>`
  return `<h3>📐 方法论进化</h3>` + timeline + initFull + latestFull
}
// Task 4：懒加载方法论（三参 async）
async function loadMethodologyInto(el, botId, runId){
  try {
    const r = await fetch(`/api/backtest/bot-methodology?bot_id=${encodeURIComponent(botId)}&run_id=${encodeURIComponent(runId)}`, { cache: 'no-store' })
    if (!r.ok) throw new Error('http ' + r.status)
    el.innerHTML = renderMethodologyHtml(await r.json())
  } catch {
    el.innerHTML = `<h3>📐 方法论进化</h3><div class="mdl-empty">方法论加载失败。</div>`
  }
}
// Task 5：移植自 index.html 的三个纯辅助函数（不改逻辑）
// 极简 markdown 渲染：够展示反思笔记的 ###/##/> 引用/- 列表/**粗体**，不引第三方库。
// 表格(| … |)会落到普通段落,可读即可。先按行识别前缀,再 esc 内容防 XSS。
function mdLite(text){
  if (!text) return ''
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  return text.split('\n').map(raw => {
    const line = raw.replace(/\s+$/, '')
    if (!line.trim()) return '<div class="rfl-sp"></div>'
    if (line.startsWith('### ')) return `<div class="rfl-h3">${inline(line.slice(4))}</div>`
    if (line.startsWith('## ')) return `<div class="rfl-h2">${inline(line.slice(3))}</div>`
    if (line.startsWith('# ')) return `<div class="rfl-h2">${inline(line.slice(2))}</div>`
    if (line.startsWith('> ')) return `<div class="rfl-quote">${inline(line.slice(2))}</div>`
    const li = line.match(/^(\s*)- (.*)$/)
    if (li) return `<div class="rfl-li" style="padding-left:${Math.floor(li[1].length / 2) * 12 + 12}px">• ${inline(li[2])}</div>`
    return `<div class="rfl-p">${inline(line)}</div>`
  }).join('')
}
// 交易记忆窗口只保留 5 维度压缩笔记：碰到第一个"原样保留/在此之后新增…（原样）"分隔标题就截断,
// 后面那些逐日 tool_call 流水(todo_write/sector_market…)不展示。建仓首日整段就是原样、没有压缩笔记,
// 此时(截断点≤标题行)回退展示原文,免得截成空白。
function clipMemoryWindow(txt){
  if (!txt) return txt
  const lines = txt.split('\n')
  const cut = lines.findIndex(l => /^###\s*(在此之后新增|最近).*原样/.test(l.trim()))
  if (cut <= 1) return txt
  return lines.slice(0, cut).join('\n').replace(/\s+$/, '') + '\n\n> （已折叠最近"原样"交易日的逐日明细，仅保留 5 维度压缩笔记）'
}
// 决策回复里 bot 常附一段 ```yaml ... ``` 的 belief 结构化输出(schema/horizons/evidence)——
// 这是给 belief-context 打分用的,不是给人看的决策正文,在决策 tab 里剥掉。只删含 `belief:` 的代码块。
function stripBeliefYaml(text){
  if (!text) return text
  return text
    .replace(/```[a-zA-Z]*\s*\n([\s\S]*?)\n```/g, (m, inner) => /(^|\n)\s*belief:\s*$/m.test(inner) ? '' : m)
    .replace(/\n{3,}/g, '\n\n')
    .trim()
}
// Task 5：当日反思面板（独立状态，不与净值图光标联动）
const REFLECTION_TABS = [['memory', '交易记忆窗口'], ['decision', '当天决策']]
function rflDatesOf(bot){ const d = bot && bot.reflectionDates; return (d && d.length) ? d : ((bot.series || []).map(p => p.trade_date)) }
function rflLatestOf(bot){ const d = rflDatesOf(bot); return d.length ? d[d.length - 1] : bot.latestTradeDate }

function mountReflection(container, bot){
  const dates = rflDatesOf(bot)
  const latest = rflLatestOf(bot)
  const st = { tab: 'memory', date: latest, cache: new Map() }   // 独立状态
  const key = d => `${bot.runId}|${bot.botId}|${d}`

  function shell(){
    const tabs = REFLECTION_TABS.map(([k, label]) => `<button data-rt="${k}"${st.tab === k ? ' class="active"' : ''}>${label}</button>`).join('')
    container.innerHTML = `<h3>当日反思 · <span class="rfl-date">${esc(st.date || '--')}</span>${st.date === latest ? '（最新）' : ''}</h3>`
      + `<div class="rfl-nav"><button data-rn="prev">‹</button>`
      + `<input type="date" class="rfl-cal" value="${esc(st.date || '')}">`
      + `<button data-rn="next">›</button><button data-rn="latest">最新</button></div>`
      + `<div class="rfl-tabs">${tabs}</div><div class="rfl-body"><div class="mdl-empty">加载中…</div></div>`
  }
  function paint(){
    const span = container.querySelector('.rfl-date'); if (span) span.textContent = st.date || '--'
    const body = container.querySelector('.rfl-body')
    const data = st.cache.get(key(st.date))
    if (!data){ body.innerHTML = '<div class="mdl-empty">加载中…</div>'; return }
    const raw = { memory: data.memoryWindow, decision: data.decision }[st.tab] || ''
    const txt = st.tab === 'memory' ? clipMemoryWindow(raw) : stripBeliefYaml(raw)
    const hint = { memory: '当日无交易记忆窗口（建仓首日或旧 run 未启用）', decision: '当日无决策回复记录' }[st.tab]
    body.innerHTML = txt.trim() ? mdLite(txt) : `<div class="mdl-empty">${hint}</div>`
  }
  async function load(d){
    if (!st.cache.has(key(d))){
      try {
        const r = await fetch(`/api/backtest/bot-reflection?bot_id=${encodeURIComponent(bot.botId)}&run_id=${encodeURIComponent(bot.runId)}&trade_date=${encodeURIComponent(d)}`, { cache: 'no-store' })
        st.cache.set(key(d), r.ok ? await r.json() : { memoryWindow: '', decision: '' })
      } catch { st.cache.set(key(d), { memoryWindow: '', decision: '' }) }
    }
    if (st.date === d) paint()
  }
  function go(d){                       // 选非决策日 → 跳到 ≥d 的下一个决策日
    if (!dates.length){ st.date = d } else {
      let t = dates.find(x => x >= d); if (!t) t = dates[dates.length - 1]; st.date = t
    }
    shell(); wire(); paint(); void load(st.date)
  }
  function step(dir){
    if (!dates.length) return
    let i = dates.indexOf(st.date); if (i < 0) i = dates.length - 1
    i = Math.min(dates.length - 1, Math.max(0, i + dir)); st.date = dates[i]
    shell(); wire(); paint(); void load(st.date)
  }
  function wire(){
    container.querySelector('.rfl-tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-rt]'); if (!b) return
      st.tab = b.dataset.rt; shell(); wire(); paint()
    })
    container.querySelector('.rfl-nav').addEventListener('click', e => {
      const b = e.target.closest('button[data-rn]'); if (!b) return
      if (b.dataset.rn === 'prev') step(-1)
      else if (b.dataset.rn === 'next') step(1)
      else if (b.dataset.rn === 'latest'){ st.date = latest; shell(); wire(); paint(); void load(st.date) }
    })
    const cal = container.querySelector('.rfl-cal')
    if (cal) cal.addEventListener('change', () => { if (cal.value) go(cal.value) })
  }
  shell(); wire(); paint(); void load(st.date)
}
</script>
