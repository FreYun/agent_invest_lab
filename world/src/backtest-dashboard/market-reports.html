<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Reports + OOS bot101</title>
<style>
:root{--bg:#080d18;--panel:#101827;--panel2:#0c1320;--border:#26354f;--line:rgba(255,255,255,.075);--text:#eaf0fb;--muted:#8b98ad;--soft:#b9c5d8;--accent:#5ed3e8;--accent2:#f0b86a;--red:#ff6b8a;--green:#62d6a3;--radius:8px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b1120 0%,var(--bg) 44%);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;letter-spacing:0}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(180deg,rgba(0,0,0,.44),transparent 82%)}
button,input,select{font:inherit}.wrap{position:relative;z-index:1;max-width:1780px;margin:0 auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}.hero h1{margin:0;font-size:28px;line-height:1.1}.sub{color:var(--muted);margin-top:7px;font-size:13px}.btn{border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);border-radius:6px;padding:7px 11px;font-size:12px;cursor:pointer}.btn:hover{border-color:var(--accent);background:rgba(94,211,232,.09)}
.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:14px;align-items:start}.panel{border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--panel);padding:14px}.head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.date-tools{margin-bottom:10px}.date-tools input{width:100%;background:rgba(255,255,255,.035);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color-scheme:dark}.date-list{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 190px);overflow:auto;padding-right:4px}.date-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid transparent;border-radius:7px;background:rgba(255,255,255,.018);padding:9px 10px;cursor:pointer;color:var(--text);text-align:left}.date-row:hover{background:rgba(255,255,255,.055);border-color:#385276}.date-row.active{background:#142236;border-color:var(--accent)}.date-row .d{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}.date-row .c{font-size:11px;color:var(--muted)}
.main-grid{display:grid;gap:14px}.headline{border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--panel);padding:15px}.headline-title{font-size:22px;font-weight:850}.headline-sub{font-size:12px;color:var(--muted);margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;background:rgba(255,255,255,.032);max-width:100%}.chip span{color:var(--muted)}.chip strong{color:var(--accent);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}.chip.risk strong{color:var(--accent2)}.chip.theme strong{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}.report{min-width:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);display:flex;flex-direction:column;min-height:560px;max-height:760px;overflow:hidden}.report-head{padding:13px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}.report-title{font-size:15px;font-weight:850}.report-meta{font-size:11px;color:var(--muted);margin-top:4px}.type-badge{border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--accent);font-family:ui-monospace,Menlo,monospace;white-space:nowrap}.report-body{overflow:auto;display:flex;flex-direction:column}.summary{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}.kv{border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:8px 9px;background:rgba(255,255,255,.02)}.kv-k{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.kv-v{font-size:13px;margin-top:4px;line-height:1.45;color:var(--text)}.markdown{padding:15px 16px 20px;font-size:13px;line-height:1.68;color:rgba(234,240,251,.93)}.markdown h1{font-size:18px;margin:0 0 12px;line-height:1.3}.markdown h2{font-size:15px;margin:20px 0 9px;color:#fff;line-height:1.35;border-top:1px solid var(--line);padding-top:14px}.markdown h3{font-size:13px;margin:16px 0 8px;color:var(--accent2);line-height:1.35}.markdown p{margin:8px 0}.markdown ul,.markdown ol{margin:8px 0 8px 20px;padding:0}.markdown li{margin:5px 0}.markdown table{width:100%;border-collapse:collapse;margin:11px 0;font-size:12px;background:rgba(255,255,255,.014);border:1px solid var(--line)}.markdown th,.markdown td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.markdown th{color:var(--muted);font-weight:700;background:rgba(255,255,255,.025)}.markdown code{font-family:ui-monospace,Menlo,monospace;color:var(--accent);background:rgba(94,211,232,.09);border:1px solid rgba(94,211,232,.13);border-radius:4px;padding:1px 4px}.markdown strong{color:#fff}.empty{border:1px dashed var(--border);border-radius:8px;padding:28px;color:var(--muted);text-align:center}.loading{color:var(--muted);padding:22px}.err{color:var(--red)}
.oos{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:14px}.oos-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.oos-title{font-size:16px;font-weight:850}.oos-sub{color:var(--muted);font-size:12px;margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.02);padding:12px}.metric-k{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.metric-v{font-size:20px;font-weight:780;margin-top:7px;font-variant-numeric:tabular-nums}.metric-s{font-size:11px;color:var(--muted);margin-top:4px}.oos-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.8fr);gap:14px}.oos-panel{border:1px solid rgba(255,255,255,.07);border-radius:8px;background:rgba(255,255,255,.018);padding:12px}.oos-panel h3{margin:0 0 10px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.chart{width:100%;height:auto;display:block}.axis{font-size:10px;fill:var(--muted)}.gridline{stroke:rgba(255,255,255,.06);stroke-width:1}.line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.area{fill:rgba(94,211,232,.13)}.baseline{stroke:rgba(240,184,106,.42);stroke-dasharray:4 4}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px 7px;border-bottom:1px solid rgba(255,255,255,.055);text-align:left;font-size:12px;vertical-align:top}.table th{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.table .num{text-align:right;font-variant-numeric:tabular-nums}.badge{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:11px}.badge.buy{color:var(--red)}.badge.sell{color:var(--green)}.badge.pending{color:var(--accent2)}.reason{color:var(--muted);font-size:12px;line-height:1.45;max-width:560px}.reports{display:flex;gap:8px;flex-wrap:wrap}.report-pill{border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px;background:rgba(255,255,255,.03)}.report-pill strong{color:var(--accent)}
@media(max-width:1320px){.cards{grid-template-columns:1fr}.report{min-height:0;max-height:none}.shell{grid-template-columns:1fr}.date-list{max-height:220px}.oos-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:14px}.hero,.oos-head{flex-direction:column;align-items:flex-start}.headline-title{font-size:19px}.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1>Market Reports</h1><div class="sub">三份日报 + bot101 固定 run 账户结果</div></div>
    <button class="btn" id="refreshBtn">刷新</button>
  </div>
  <div class="shell">
    <aside class="panel"><div class="head"><span>报告日期</span><span id="dateCount"></span></div><div class="date-tools"><input id="dateSearch" type="search" placeholder="筛选日期 YYYY-MM"></div><div class="date-list" id="dateList"><div class="loading">加载中...</div></div></aside>
    <main class="main-grid"><section class="headline" id="headline"><div class="loading">加载中...</div></section><section class="cards" id="cards"></section><section class="oos" id="oos"><div class="loading">加载 bot101 账户...</div></section></main>
  </div>
</div>
<script>
var TYPES=[['market_context','市场行情判断'],['market_mainline','市场主线'],['mainline_rotation','主线 Rotation']]
var state={payload:null,oos:null,selectedDate:'',query:''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function codeRe(){var tick=String.fromCharCode(96);return new RegExp(tick+'([^'+tick+']+)'+tick,'g')}
function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(codeRe(),'<code>$1</code>')}
function renderMarkdown(md){if(!md)return '<div class="empty">没有正文</div>';var lines=String(md).split(/\r?\n/),out=[],table=[],list=null;function closeList(){if(list){out.push('</'+list+'>');list=null}}function cells(row){var parts=row.split('|');if(parts[0].trim()==='')parts.shift();if(parts[parts.length-1].trim()==='')parts.pop();return parts.map(function(c){return inlineMd(c.trim())})}function flushTable(){if(!table.length)return;var rows=table.splice(0);if(rows.length<2){rows.forEach(function(r){out.push('<p>'+inlineMd(r)+'</p>')});return}var head=cells(rows[0]);var body=rows.slice(2).map(cells);out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>')}lines.forEach(function(raw){var line=raw.trim();if(line.indexOf('|')>=0&&/^\|?.+\|.+\|?$/.test(line)){closeList();table.push(line);return}flushTable();if(!line){closeList();return}var h=line.match(/^(#{1,3})\s+(.+)/);if(h){closeList();out.push('<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>');return}var ul=line.match(/^[-*]\s+(.+)/);if(ul){if(list!=='ul'){closeList();list='ul';out.push('<ul>')}out.push('<li>'+inlineMd(ul[1])+'</li>');return}var ol=line.match(/^\d+[.)]\s+(.+)/);if(ol){if(list!=='ol'){closeList();list='ol';out.push('<ol>')}out.push('<li>'+inlineMd(ol[1])+'</li>');return}closeList();out.push('<p>'+inlineMd(line)+'</p>')});flushTable();closeList();return out.join('')}
function pick(obj,keys){for(var i=0;i<keys.length;i++){var v=obj&&obj[keys[i]];if(v!=null&&v!=='')return v}return ''}
function short(v){if(v==null||v==='')return '--';if(Array.isArray(v))return v.slice(0,4).map(short).join(' / ');if(typeof v==='object')return Object.keys(v).slice(0,4).map(function(k){return k+': '+short(v[k])}).join('；');return String(v)}
function items(type,s){if(!s||typeof s!=='object')return[];if(type==='market_context')return[['行情',pick(s,['regime','market_regime'])],['Risk',pick(s,['risk_state'])],['置信度',pick(s,['confidence'])],['主导变量',pick(s,['dominant_var','dominant_variable','one_liner'])]];if(type==='market_mainline')return[['主线',pick(s,['mainline_theme','dominant_group','theme'])],['置信度',pick(s,['confidence'])],['Regime',pick(s,['regime'])],['核心板块',pick(s,['dominant_sectors','sectors','mainline_sectors','top_sectors'])]];return[['Regime',pick(s,['regime'])],['持续天数',pick(s,['regime_days'])],['动作',pick(s,['today_action','action','decision'])],['证伪',pick(s,['rebalance_falsification','falsification'])]]}
function card(type,label,r){if(!r)return'<article class="report"><div class="report-head"><div><div class="report-title">'+label+'</div><div class="report-meta">缺失</div></div><span class="type-badge">'+type+'</span></div><div class="report-body"><div class="empty">这个日期没有 '+label+'</div></div></article>';var s=r.structured;var kv=items(type,s).filter(function(x){return x[1]!==''&&x[1]!=null}).map(function(x){return'<div class="kv"><div class="kv-k">'+esc(x[0])+'</div><div class="kv-v">'+inlineMd(short(x[1]))+'</div></div>'}).join('');return'<article class="report"><div class="report-head"><div><div class="report-title">'+label+'</div><div class="report-meta">'+esc(r.as_of_date)+' · '+esc(r.generated_at||'')+'</div></div><span class="type-badge">'+type+'</span></div><div class="report-body">'+(kv?'<div class="summary">'+kv+'</div>':'')+'<div class="markdown">'+renderMarkdown(r.content_md)+'</div></div></article>'}
function renderDates(){var dates=(state.payload&&state.payload.dates)||[];var q=state.query.trim();var shown=q?dates.filter(function(d){return d.as_of_date.indexOf(q)>=0}):dates;document.getElementById('dateCount').textContent=String(dates.length);document.getElementById('dateList').innerHTML=shown.map(function(d){return'<button class="date-row '+(d.as_of_date===state.selectedDate?'active':'')+'" data-date="'+esc(d.as_of_date)+'"><span class="d">'+esc(d.as_of_date)+'</span><span class="c">'+d.report_count+'/3</span></button>'}).join('')||'<div class="empty">没有匹配日期</div>'}
function renderHeadline(){var r=(state.payload&&state.payload.reports)||{};var c=(r.market_context&&r.market_context.structured)||{};var m=(r.market_mainline&&r.market_mainline.structured)||{};var rot=(r.mainline_rotation&&r.mainline_rotation.structured)||{};var chips=[['行情',pick(c,['regime','market_regime']),''],['Risk',pick(c,['risk_state']),'risk'],['主线',pick(m,['mainline_theme','dominant_group','theme']),'theme'],['Rotation',pick(rot,['regime']),'']].filter(function(x){return x[1]});document.getElementById('headline').innerHTML='<div class="headline-title">'+esc(state.selectedDate||'--')+'</div><div class="headline-sub">三份报告和 bot101 当日账户结果使用同一个日期对齐。</div><div class="chips">'+chips.map(function(x){return'<span class="chip '+x[2]+'"><span>'+esc(x[0])+'</span><strong>'+esc(short(x[1]))+'</strong></span>'}).join('')+'</div>'}
function renderReports(){var reports=(state.payload&&state.payload.reports)||{};document.getElementById('cards').innerHTML=TYPES.map(function(t){return card(t[0],t[1],reports[t[0]])}).join('')}
function num(v){var n=Number(v);return Number.isFinite(n)?n:0}function fmtMoney(v){return new Intl.NumberFormat('zh-CN',{maximumFractionDigits:0}).format(num(v))}function fmtPct(v){return v==null?'--':(num(v)>=0?'+':'')+num(v).toFixed(2)+'%'}function fmtNav(v){return v==null?'--':num(v).toFixed(4)}
function chart(series){if(!series||!series.length)return'<div class="empty">没有净值曲线</div>';var w=900,h=260,p={l:46,r:16,t:16,b:32};var vals=series.map(function(x){return num(x.net_value)||1});var min=Math.min.apply(null,vals.concat([1])),max=Math.max.apply(null,vals.concat([1]));if(max-min<0.001){max+=0.01;min-=0.01}function x(i){return p.l+(w-p.l-p.r)*(series.length===1?0:i/(series.length-1))}function y(v){return h-p.b-(h-p.t-p.b)*((v-min)/(max-min))}var pts=series.map(function(r,i){return x(i).toFixed(1)+','+y(num(r.net_value)||1).toFixed(1)}).join(' ');var area=p.l+','+(h-p.b)+' '+pts+' '+x(series.length-1)+','+(h-p.b);var ticks=[min,(min+max)/2,max];return'<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+ticks.map(function(t){return'<line class="gridline" x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y(t)+'" y2="'+y(t)+'"></line><text class="axis" x="6" y="'+(y(t)+4)+'">'+t.toFixed(3)+'</text>'}).join('')+'<line class="baseline" x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y(1)+'" y2="'+y(1)+'"></line><polygon class="area" points="'+area+'"></polygon><polyline class="line" points="'+pts+'"></polyline><text class="axis" x="'+p.l+'" y="'+(h-9)+'">'+esc(series[0].trade_date)+'</text><text class="axis" x="'+(w-p.r-70)+'" y="'+(h-9)+'">'+esc(series[series.length-1].trade_date)+'</text></svg>'}
function table(rows,heads,rowfn,empty){if(!rows.length)return'<div class="empty">'+empty+'</div>';return'<table class="table"><thead><tr>'+heads.map(function(h){return'<th class="'+(h.num?'num':'')+'">'+esc(h.t)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(rowfn).join('')+'</tbody></table>'}
function renderOos(){var d=state.oos;if(!d){document.getElementById('oos').innerHTML='<div class="loading">加载 bot101 账户...</div>';return}var s=d.snapshot||{};var metrics=[['净值',fmtNav(s.net_value),'run_id='+d.runId],['总资产','¥'+fmtMoney(s.total_value),'固定 OOS 账户'],['累计收益',fmtPct(s.cumulative_return_pct),'当日快照'],['现金仓位',s.cash_weight==null?'--':(num(s.cash_weight)*100).toFixed(1)+'%','收盘权重'],['订单数',String((d.orders||[]).length),(d.actions||[]).length+' 条已结算动作']].map(function(x){return'<div class="metric"><div class="metric-k">'+esc(x[0])+'</div><div class="metric-v">'+esc(x[1])+'</div><div class="metric-s">'+esc(x[2])+'</div></div>'}).join('');var orders=table(d.orders||[],[{t:'日期'},{t:'动作'},{t:'基金'},{t:'金额',num:1},{t:'状态'},{t:'理由'}],function(r){return'<tr><td>'+esc(r.order_date)+'</td><td><span class="badge '+esc(r.order_type)+'">'+esc(r.order_type)+'</span></td><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+'</div></td><td class="num">¥'+fmtMoney(r.order_amount)+'</td><td><span class="badge '+esc(r.status)+'">'+esc(r.status)+'</span></td><td><div class="reason">'+esc(r.action_reason||'')+'</div></td></tr>'},'当天没有订单');var pos=table(d.positions||[],[{t:'基金'},{t:'仓位',num:1},{t:'市值',num:1}],function(r){return'<tr><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+(r.theme?' · '+esc(r.theme):'')+'</div></td><td class="num">'+(num(r.weight)*100).toFixed(2)+'%</td><td class="num">¥'+fmtMoney(r.market_value)+'</td></tr>'},'当天没有持仓快照');var actions=table(d.actions||[],[{t:'日期'},{t:'动作'},{t:'基金'},{t:'金额',num:1},{t:'份额',num:1}],function(r){return'<tr><td>'+esc(r.action_date)+'</td><td>'+esc(r.action_type)+'</td><td>'+esc(r.fund_name||r.fund_code)+'<div class="sub">'+esc(r.fund_code)+'</div></td><td class="num">¥'+fmtMoney(r.amount)+'</td><td class="num">'+fmtMoney(r.shares)+'</td></tr>'},'当天没有已结算动作');var reps=(d.reports||[]).length?'<div class="reports">'+d.reports.map(function(r){return'<span class="report-pill"><strong>'+esc(r.report_type)+'</strong> · '+esc(r.as_of_date)+' · '+esc(r.chars)+' chars</span>'}).join('')+'</div>':'<div class="empty">当天没有报告镜像</div>';document.getElementById('oos').innerHTML='<div class="oos-head"><div><div class="oos-title">bot101 当日结果</div><div class="oos-sub">固定 run_id='+esc(d.runId)+' · bot_id=bot101 · 日期 '+esc(d.selectedDate||'--')+'</div></div></div><div class="metrics">'+metrics+'</div><div class="oos-grid"><div><div class="oos-panel"><h3>账户净值曲线</h3>'+chart(d.series||[])+'</div><div class="oos-panel" style="margin-top:14px"><h3>bot101 订单</h3>'+orders+'</div><div class="oos-panel" style="margin-top:14px"><h3>已结算动作</h3>'+actions+'</div></div><div><div class="oos-panel"><h3>三份报告状态</h3>'+reps+'</div><div class="oos-panel" style="margin-top:14px"><h3>当日持仓</h3>'+pos+'</div></div></div>'}
function render(){renderDates();renderHeadline();renderReports();renderOos()}
function load(date){var reportUrl='/api/market-reports'+(date?'?date='+encodeURIComponent(date):'');fetch(reportUrl,{cache:'no-store'}).then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json()}).then(function(p){state.payload=p;state.selectedDate=p.selectedDate;return fetch('/api/oos/bot101?date='+encodeURIComponent(state.selectedDate),{cache:'no-store'})}).then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.json()}).then(function(o){state.oos=o;render()}).catch(showErr)}
function showErr(err){document.getElementById('cards').innerHTML='<div class="empty err">加载失败：'+esc(err.message||err)+'</div>';document.getElementById('oos').innerHTML='<div class="empty err">加载失败：'+esc(err.message||err)+'</div>'}
document.getElementById('dateList').addEventListener('click',function(e){var row=e.target.closest('.date-row');if(row)load(row.dataset.date)})
document.getElementById('dateSearch').addEventListener('input',function(e){state.query=e.target.value;renderDates()})
document.getElementById('refreshBtn').addEventListener('click',function(){load(state.selectedDate)})
load('')
</script>
</body>
</html>
