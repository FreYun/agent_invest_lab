<script>
var TYPES=[['market_context','市场行情判断'],['market_mainline','市场主线'],['market_mainline_daily','市场主线（日度）'],['mainline_rotation','主线 Rotation'],['mainline_rotation_daily','主线 Rotation（日度）'],['macro_news','宏观资讯要点']]
var state={payload:null,oos:null,reflection:null,intraday:null,selectedDate:'',query:'',collapsed:{market_context:true,market_mainline:true,market_mainline_daily:true,mainline_rotation:true,mainline_rotation_daily:true,macro_news:true}}
var DAILY_TYPES={market_mainline_daily:1,mainline_rotation_daily:1}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function codeRe(){var tick=String.fromCharCode(96);return new RegExp(tick+'([^'+tick+']+)'+tick,'g')}
function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(codeRe(),'<code>$1</code>')}
function renderMarkdown(md){if(!md)return '<div class="empty">没有正文</div>';var lines=String(md).split(/\r?\n/),out=[],table=[],list=null,code=null,bt=String.fromCharCode(96),fence3=bt+bt+bt;function closeList(){if(list){out.push('</'+list+'>');list=null}}function cells(row){var parts=row.split('|');if(parts[0].trim()==='')parts.shift();if(parts[parts.length-1].trim()==='')parts.pop();return parts.map(function(c){return inlineMd(c.trim())})}function flushTable(){if(!table.length)return;var rows=table.splice(0);if(rows.length<2){rows.forEach(function(r){out.push('<p>'+inlineMd(r)+'</p>')});return}var head=cells(rows[0]);var body=rows.slice(2).map(cells);out.push('<table><thead><tr>'+head.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>')}lines.forEach(function(raw){var isFence=raw.trim().slice(0,3)===fence3;if(code!==null){if(isFence){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null}else{code.push(raw)}return}if(isFence){closeList();flushTable();code=[];return}var line=raw.trim();var hr=line.match(/^(-{3,}|\*{3,}|_{3,})$/);if(hr){closeList();flushTable();out.push('<hr>');return}if(line.indexOf('|')>=0&&/^\|?.+\|.+\|?$/.test(line)){closeList();table.push(line);return}flushTable();if(!line){closeList();return}var h=line.match(/^(#{1,3})\s+(.+)/);if(h){closeList();out.push('<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>');return}var ul=line.match(/^[-*]\s+(.+)/);if(ul){if(list!=='ul'){closeList();list='ul';out.push('<ul>')}out.push('<li>'+inlineMd(ul[1])+'</li>');return}var ol=line.match(/^\d+[.)]\s+(.+)/);if(ol){if(list!=='ol'){closeList();list='ol';out.push('<ol>')}out.push('<li>'+inlineMd(ol[1])+'</li>');return}closeList();out.push('<p>'+inlineMd(line)+'</p>')});flushTable();closeList();if(code!==null){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>')}return out.join('')}
function pick(obj,keys){for(var i=0;i<keys.length;i++){var v=obj&&obj[keys[i]];if(v!=null&&v!=='')return v}return ''}

function buildBands(holdingsByDate,dates){var meta={};dates.forEach(function(d){(holdingsByDate[d]||[]).forEach(function(h){var w=num(h.weight)||0;var c=meta[h.fund_code];if(!c)meta[h.fund_code]={fund_name:h.fund_name,maxWeight:w};else if(w>c.maxWeight)c.maxWeight=w})});var ordered=Object.keys(meta).sort(function(a,b){return meta[b].maxWeight-meta[a].maxWeight||(a<b?-1:a>b?1:0)});var bands=ordered.map(function(code){return{fund_code:code,fund_name:meta[code].fund_name,lower:dates.map(function(){return 0}),upper:dates.map(function(){return 0})}});dates.forEach(function(d,i){var byCode={};(holdingsByDate[d]||[]).forEach(function(h){byCode[h.fund_code]=num(h.weight)||0});var cum=0;bands.forEach(function(b){b.lower[i]=cum;cum+=byCode[b.fund_code]||0;b.upper[i]=cum})});return bands}
function navChart(series,actionsAll){var w=900,h=260,p={l:46,r:16,t:16,b:30};var vals=series.map(function(x){return num(x.net_value)||1});var min=Math.min.apply(null,vals.concat([1])),max=Math.max.apply(null,vals.concat([1]));if(max-min<0.001){max+=0.01;min-=0.01}var n=series.length;function X(i){return p.l+(w-p.l-p.r)*(n===1?0.5:i/(n-1))}function Y(v){return h-p.b-(h-p.t-p.b)*((v-min)/(max-min))}var xs=series.map(function(_,i){return X(i)}),ys=series.map(function(r){return Y(num(r.net_value)||1)});var pts=series.map(function(_,i){return xs[i].toFixed(1)+','+ys[i].toFixed(1)}).join(' ');var area=p.l+','+(h-p.b)+' '+pts+' '+xs[n-1].toFixed(1)+','+(h-p.b);var ticks=[min,(min+max)/2,max];var idxByDate={};series.forEach(function(r,i){idxByDate[r.trade_date]=i});var groups={};(actionsAll||[]).forEach(function(a){var side=actSide(a.action_type);var i=idxByDate[a.action_date];if(i==null)return;var key=a.action_date+'|'+side;if(!groups[key])groups[key]={date:a.action_date,side:side,x:xs[i],y:ys[i],count:0,amount:0,funds:[]};var g=groups[key];g.count++;g.amount+=num(a.amount)||0;var fn=a.fund_name||a.fund_code;if(fn&&g.funds.indexOf(fn)<0)g.funds.push(fn)});var sidesByDate={};Object.keys(groups).forEach(function(k){var g=groups[k];(sidesByDate[g.date]=sidesByDate[g.date]||{})[g.side]=1});var marks=Object.keys(groups).map(function(k){var m=groups[k];var both=Object.keys(sidesByDate[m.date]||{}).length>1;var cy=both?(m.side==='sell'?m.y-7:m.y+7):m.y;var labelY=m.side==='sell'?cy-12:cy+18;var sideText=m.side==='sell'?'卖出':'买入';var cnt=m.count>1?' '+m.count+'笔':'';var title=m.date+' '+sideText+cnt+' ¥'+fmtMoney(m.amount)+(m.funds.length?' '+m.funds.join('、'):'');var cls=m.side==='sell'?'marker-sell':'marker-buy';var lab=m.side==='sell'?'卖':'买';return'<g><circle cx="'+m.x.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="5.5" class="'+cls+'"></circle><text x="'+m.x.toFixed(1)+'" y="'+labelY.toFixed(1)+'" text-anchor="middle" class="marker-text">'+lab+'</text><title>'+esc(title)+'</title></ function positionChart(series,holdingsByDate){var dates=series.map(function(r){return r.trade_date});if(!dates.length)return'';var w=900,h=96,p={l:46,r:16,t:8,b:16};var n=dates.length;function X(i){return p.l+(w-p.l-p.r)*(n===1?0.5:i/(n-1))}function Yw(wt){return h-p.b-(h-p.t-p.b)*Math.max(0,Math.min(1,wt))}var xs=dates.map(function(_,i){return X(i)});var bands=buildBands(holdingsByDate,dates);var totalUpper=bands.length?bands[bands.length-1].upper:dates.map(function(){return 0});var bandsSvg;if(bands.length<=1){var up=bands.length?bands[0].upper:dates.map(function(){return 0});var ptsU=dates.map(function(_,i){return xs[i].toFixed(1)+' '+Yw(up[i]).toFixed(1)}).join(' L');var areaPath='M'+xs[0].toFixed(1)+' '+Yw(0).toFixed(1)+' L'+ptsU+' L'+xs[n-1].toFixed(1)+' '+Yw(0).toFixed(1)+' Z';bandsSvg='<path d="'+areaPath+'" fill="rgba(192,132,252,.18)"></path><path d="'+areaPath.replace(/ Z$/,'')+'" fill="none" stroke="#c084fc" stroke-width="1.5"></path>'}else{bandsSvg=bands.map(function(b){var up=dates.map(function(_,i){return xs[i].toFixed(1)+' '+Yw(b.upper[i]).toFixed(1)}).join(' L');var lo=dates.map(function(_,i){var j=n-1-i;return xs[j].toFixed(1)+' '+Yw(b.lower[j]).toFixed(1)}).join(' L');return'<path d="M'+up+' L'+lo+' Z" fill="'+fundColor(b.fund_code)+'" fill-opacity="0.78"></path>'}).join('')}var topPath='M'+xs[0].toFixed(1)+' '+Yw(totalUpper[0]).toFixed(1)+' '+dates.map(function(_,i){return'L'+xs[i].toFixed(1)+' '+Yw(totalUpper[i]).toFixed(1)}).join(' ');var yTicks=[0,0.5,1].map(function(wt){var y=Yw(wt);return'<line class="gridline" x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"></line><text class="axis" x="6" y="'+(y+4).toFixed(1)+'">'+(wt*100).toFixed(0)+'%</text>'}).join('');var legend=bands.length?'<div class="pos-legend">'+bands.map(function(b){return'<span class="pos-lg-item"><span class="pos-lg-sw" style="background:'+fundColor(b.fund_code)+'"></span>'+esc(b.fund_code)+' '+esc(b.fund_name)+'</span>'}).join('')+'</div>':'';return' <style>
#bc-launch{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:linear-gradient(135deg,rgba(94,211,232,.16),rgba(94,211,232,.04));color:var(--text);border-radius:999px;padding:11px 16px;font-size:13px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.45)}
#bc-launch:hover{background:rgba(94,211,232,.2)}
#bc-launch .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#bc-panel{position:fixed;right:22px;bottom:22px;z-index:51;width:430px;max-width:calc(100vw - 28px);height:620px;max-height:calc(100vh - 40px);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
#bc-panel.open{display:flex}
.bc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
.bc-head .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.bc-head .t .av{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5ed3e8,#7c83ff);display:flex;align-items:center;justify-content:center;font-size:12px}
.bc-head .asof{font-size:11px;color:var(--muted);margin-top:2px}
.bc-head .x{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1}
.bc-head .x:hover{color:var(--text);border-color:var(--accent)}
.bc-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.bc-row{display:flex;flex-direction:column;max-width:92%}
.bc-row.user{align-self:flex-end;align-items:flex-end}
.bc-row.bot{align-self:flex-start;align-items:flex-start}
.bc-bubble{padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.55;word-break:break-word}
.bc-row.user .bc-bubble{background:rgba(94,211,232,.14);border:1px solid rgba(94,211,232,.3)}
.bc-row.bot .bc-bubble{background:var(--panel2);border:1px solid var(--border);color:var(--soft)}
.bc-bubble.md p{margin:.35em 0}.bc-bubble.md h1,.bc-bubble.md h2,.bc-bubble.md h3{margin:.5em 0 .3em;font-size:1.02em}
.bc-bubble.md table{border-collapse:collapse;width:100%;margin:.4em 0;font-size:12px}.bc-bubble.md th,.bc-bubble.md td{border:1px solid var(--border);padding:3px 6px;text-align:left}
.bc-bubble.md code{background:rgba(255,255,255,.08);padding:1px 4px;border-radius:4px;font-size:12px}
.bc-bubble.md ul,.bc-bubble.md ol{margin:.3em 0;padding-left:1.2em}
.bc-trace{margin-top:6px;font-size:11px;color:var(--muted)}
.bc-trace summary{cursor:pointer;list-style:none;color:var(--accent);user-select:none}
.bc-trace summary::-webkit-details-marker{display:none}
.bc-trace .tr-item{margin:5px 0;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.bc-trace .tr-item .nm{color:var(--text)}.bc-trace .tr-item .bad{color:var(--red)}.bc-trace .tr-item .good{color:var(--green)}
.bc-trace pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:120px;overflow:auto;font-size:10.5px}
.bc-think{align-self:flex-start;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sp{display:inline-block;width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:bcspin .8s linear infinite;vertical-align:-1px}
@keyframes bcspin{to{transform:rotate(360deg)}}
.bc-streaming{min-width:120px}
.bc-tools:not(:empty){display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.bc-chip{font-size:11.5px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:7px;color:var(--soft)}
.bc-chip.pending{border-color:rgba(94,211,232,.35)}
.bc-chip.ok{border-color:rgba(98,214,163,.4);color:var(--green)}
.bc-chip.fail{border-color:rgba(255,107,138,.4);color:var(--red)}
.bc-chip b{color:var(--text);font-weight:600}
.bc-live{font-size:13px;line-height:1.55;color:var(--soft);word-break:break-word;white-space:normal}
.bc-dim{color:var(--muted)}
.bc-cursor{color:var(--accent);animation:bcblink 1s step-start infinite;margin-left:1px}
@keyframes bcblink{50%{opacity:0}}
.bc-foot{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;align-items:flex-end;background:var(--panel2)}
.bc-foot textarea{flex:1;resize:none;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;max-height:120px;min-height:38px;line-height:1.4}
.bc-foot textarea:focus{outline:none;border-color:var(--accent)}
.bc-foot .send{border:1px solid var(--accent);background:rgba(94,211,232,.14);color:var(--text);border-radius:8px;padding:0 14px;height:38px;cursor:pointer;font-size:13px;white-space:nowrap}
.bc-foot .send:disabled{opacity:.45;cursor:not-allowed}
.bc-empty{color:var(--muted);font-size:12px;text-align:center;margin:auto;padding:0 24px;line-height:1.7}
.bc-err{color:var(--red);font-size:12px}
</style>
<button id="bc-launch"><span class="dot"></span>问 bot101</button>
<div id="bc-panel">
  <div class="bc-head">
    <div><div class="t"><span class="av">🤖</span>与 bot101 对话</div><div class="asof" id="bc-asof">数据时点：--</div></div>
    <button class="x" id="bc-close" title="关闭">✕</button>
  </div>
  <div class="bc-msgs" id="bc-msgs"></div>
  <div class="bc-foot">
    <textarea id="bc-input" rows="1" placeholder="问 bot101：为什么这么配置？后市怎么看？帮我查个指数/估值…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="send" id="bc-send">发送</button>
  </div>
</div>
<script>
(function(){
  var history=[]; // {role:'user'|'assistant', content}
  var busy=false;
  var $=function(id){return document.getElementById(id)};
  var panel=$('bc-panel'),msgs=$('bc-msgs'),input=$('bc-input');
  function curDate(){return (window.state&&window.state.selectedDate)||''}
  function setAsof(){$('bc-asof').textContent='数据时点：'+(curDate()||'--')+'（PIT 锁死该日及之前）'}
  function emptyHint(){msgs.innerHTML='<div class="bc-empty">我是 <b>bot101</b>，多基金大类资产配置选手。<br>问我对当前市场/主线的看法、为什么这么配仓，<br>或让我现场调数据工具帮你查行情、估值、宏观资讯。<br><span style="opacity:.7">回答基于你正在看的这一天（'+(curDate()||'最新')+'），PIT 不穿越未来。</span></div>'}
  function scroll(){msgs.scrollTop=msgs.scrollHeight}
  function bubble(role,contentHtml,traceHtml){
    var row=document.createElement('div');row.className='bc-row '+(role==='user'?'user':'bot');
    row.innerHTML='<div class="bc-bubble '+(role==='user'?'':'md')+'">'+contentHtml+'</div>'+(traceHtml||'');
    msgs.appendChild(row);scroll();return row;
  }
  function traceBlock(trace){
    if(!trace||!trace.length)return'';
    var items=trace.map(function(t){
      var cls=t.ok?'good':'bad';var args='';try{args=JSON.stringify(t.args)}catch(e){args=''}
      return '<div class="tr-item"><span class="'+cls+'">'+(t.ok?'✓':'✗')+'</span> <span class="nm">['+esc(t.server)+'] '+esc(t.name)+'</span> <span style="opacity:.7">'+esc(args).slice(0,120)+'</span><pre>'+esc(t.preview||'')+'</pre></div>';
    }).join('');
    return '<details class="bc-trace"><summary>🔧 调用了 '+trace.length+' 个数据工具（点击展开）</summary>'+items+'</details>';
  }
  function open(){panel.classList.add('open');$('bc-launch').style.display='none';setAsof();if(!history.length)emptyHint();input.focus();}
  function close(){panel.classList.remove('open');$('bc-launch').style.display='flex';}
  // 流式答复气泡：上方工具进度区 + 下方逐 token 文本区。
  function makeStreamBubble(){
    var row=document.createElement('div');row.className='bc-row bot';
    row.innerHTML='<div class="bc-bubble md bc-streaming"><div class="bc-tools"></div><div class="bc-live"></div></div>';
    msgs.appendChild(row);scroll();
    return {row:row,liveEl:row.querySelector('.bc-live'),toolsEl:row.querySelector('.bc-tools')};
  }
  // 读取 SSE 响应体：按 \n\n 切事件，解析 event:/data: 行后回调 handler(event,obj)。
  function streamChat(payload,handler){
    return fetch('/api/bot101/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
      .then(function(resp){
        if(!resp.ok||!resp.body){return resp.text().then(function(){throw new Error('HTTP '+resp.status)})}
        var reader=resp.body.getReader(),dec=new TextDecoder(),buf='';
        function dispatch(chunk){
          var ev='message',data='';
          chunk.split('\n').forEach(function(line){line=line.replace(/\r$/,'');
            if(line.indexOf('event:')===0)ev=line.slice(6).trim();
            else if(line.indexOf('data:')===0)data+=line.slice(5).replace(/^ /,'');});
          if(!data)return;var obj;try{obj=JSON.parse(data)}catch(e){return}handler(ev,obj);
        }
        function pump(){return reader.read().then(function(r){
          if(r.done){if(buf.trim())dispatch(buf);return}
          buf+=dec.decode(r.value,{stream:true});var i;
          while((i=buf.indexOf('\n\n'))>=0){dispatch(buf.slice(0,i));buf=buf.slice(i+2);}
          return pump();});}
        return pump();
      });
  }
  function send(){
    if(busy)return;var text=input.value.trim();if(!text)return;
    if(!history.length)msgs.innerHTML='';
    busy=true;$('bc-send').disabled=true;input.value='';input.style.height='auto';
    history.push({role:'user',content:text});
    bubble('user',esc(text).replace(/\n/g,'<br>'));
    setAsof();
    var sb=makeStreamBubble(),liveText='',finished=false;
    function renderLive(){sb.liveEl.innerHTML=(liveText?esc(liveText).replace(/\n/g,'<br>'):'<span class="bc-dim">bot101 正在思考…</span>')+'<span class="bc-cursor">▌</span>';scroll();}
    renderLive();
    function addChip(server,name){var c=document.createElement('div');c.className='bc-chip pending';c.setAttribute('data-name',name);c.innerHTML='<span class="sp"></span>调用 <b>'+esc(name)+'</b> <span class="bc-dim">['+esc(server)+']</span>';sb.toolsEl.appendChild(c);scroll();}
    function resolveChip(name,ok){var chips=sb.toolsEl.querySelectorAll('.bc-chip.pending');for(var i=chips.length-1;i>=0;i--){if(chips[i].getAttribute('data-name')===name){chips[i].className='bc-chip '+(ok?'ok':'fail');chips[i].innerHTML=(ok?'✓':'✗')+' <b>'+esc(name)+'</b>';break;}}}
    function finish(obj){finished=true;var reply=obj.reply||'(无回复)';history.push({role:'assistant',content:reply});sb.row.innerHTML='<div class="bc-bubble md">'+renderMarkdown(reply)+'</div>'+traceBlock(obj.trace);scroll();}
    function fail(msg){finished=true;sb.row.innerHTML='<div class="bc-bubble md"><span class="bc-err">'+esc(msg)+'</span></div>';if(history.length&&history[history.length-1].role==='user')history.pop();scroll();}
    streamChat({messages:history,date:curDate(),stream:true},function(ev,obj){
      if(ev==='step'){liveText='';renderLive();}
      else if(ev==='token'){liveText+=(obj.text||'');renderLive();}
      else if(ev==='tool_call'){addChip(obj.server||'?',obj.name||'?');}
      else if(ev==='tool_result'){resolveChip(obj.name||'?',!!obj.ok);}
      else if(ev==='done'){finish(obj);}
      else if(ev==='error'){fail('出错了：'+(obj.error||''));}
    }).catch(function(e){if(!finished)fail('网络错误：'+(e.message||e));})
      .then(function(){busy=false;$('bc-send').disabled=false;input.focus();});
  }
  $('bc-launch').addEventListener('click',open);
  $('bc-close').addEventListener('click',close);
  $('bc-send').addEventListener('click',send);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(120,input.scrollHeight)+'px';});
})();
</script>
</body>
</html>
