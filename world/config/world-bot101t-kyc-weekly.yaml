simworld_tools:
- name: fund_top_holdings
  description: 基金前十大重仓股。
- name: fund_nav
  description: 基金净值历史（可以取更长历史的净值信息）。
- name: fund_invest_position
  description: 基金详细持仓：股票（A 股 + QDII）+ 债券（含债项评级）。
- name: market_index_quote
  description: 指数行情。当前只有 market='cn' 真接入，hk/us 上游未实现。
- name: market_index_val
  description: A股指数估值：返回 PE_TTM + 历史百分位的单点快照。
- name: market_index_gzxjb
  description: A股指数股债性价比：股票相对债券的风险溢价。
- name: market_temperature
  description: A股市场温度：市场情绪/风险综合温度计。
- name: sector_search
  description: 板块检索（行业/主题）：按名称模糊找板块代码 BKxxxxxx。
- name: sector_market
  description: 板块行情：日收益率 + 估值(PE/PB) + 主力净流入。
- name: sector_factor
  description: 板块因子分：动量 + 风险分 + 机会分。
- name: sector_constituents
  description: 板块成分股：取板块 <= T 最新一期全部成分股（代码+名称）。
- name: sector_index_match
  description: 指数↔板块匹配：板块映射到可交易指数/ETF，或指数拆到主题板块。
- name: sector_factor_detail
  description: 板块子因子明细 / 拥挤度细分：把风险分拆成两个构成因子。
- name: option_vix
