# KYC 测试配置（scripts/kyc_batch_setup.py 生成，mode=weekly）。每 bot 一个 KYC 画像，一个 run 横向对比。
research_loop: /home/rooot/.openclaw/research-loop/ts
research_loop_rust_bin: /home/rooot/.openclaw/research-loop/rust/target/release/research-loop-rust2
bots:
- bot101t_k1
- bot101t_k2
- bot101t_k3
- bot101t_k4
- bot101t_k5
- bot101t_k6
replay:
  from: '2025-06-23'
  to: '2026-06-23'
calendar: ../runtime/calendar.json
concurrency: 3
per_bot_timeout_seconds: 900
research_day_every: 0
research_day_timeout_seconds: 1200
chat_step_mode: weekly
chat_weekday: 1
enable_user_self_edit: true
shadow_include:
