research_loop: /home/rooot/.openclaw/research-loop/ts
research_loop_rust_bin: /home/rooot/.openclaw/research-loop/rust/target/release/research-loop-rust2

# 大类资产配置专用世界：只跑 bot_multi，避免被权益-only 可买池约束。
bots: [bot_multi]

replay:
  from: "2023-01-03"
  to: "2026-05-29"

calendar: ../runtime/calendar.json

# ultrafast: 单 bot、短超时。bot_multi 的方法论会自行区分日度扫描/周度复核/月度调仓。
concurrency: 1
per_bot_timeout_seconds: 300
research_day_every: 20
research_day_timeout_seconds: 600

fund_mcp_cli: ../../fund-portfolio-mcp/cli_tools.py
simworld_upstream_url: http://127.0.0.1:18078/mcp

# 多资产可买池：
# - A股基金：宽基、红利、医药、证券、电子、新能源、基建、汽车等
# - 债券基金：001512
# - 黄金基金：002610 / 518880
# - 货币/现金：若可买池中无货币基金，由账户现金承担现金类资产角色
buyable_fund_codes:
  - "000051"   # 华夏沪深300ETF联接A
  - "000962"   # 天弘中证500ETF联接A
  - "001512"   # 易方达中债3-5年期国债指数
  - "001550"   # 天弘中证医药100A
  - "001552"   # 天弘中证证券保险A
  - "001617"   # 天弘中证电子ETF联接A
  - "002610"   # 博时黄金ETF联接A
  - "004854"   # 广发中证全指汽车指数A
  - "005223"   # 广发中证基建工程ETF联接A
  - "006451"   # 代表性权益/行业候选
  - "006961"   # 代表性权益/行业候选
  - "012543"   # 嘉实中证新能源汽车指数A
  - "161907"   # 红利ETF联接
  - "518880"   # 黄金ETF
