research_loop: /home/rooot/.openclaw/research-loop/ts
research_loop_rust_bin: /home/rooot/.openclaw/research-loop/rust/target/release/research-loop-rust2

# ── 决策频次对照实验 · 周度臂 ──────────────────────────────────────────────
# 与 daily / monthly 臂唯一差别 = chat_step_mode。weekly = 每个自然周（按周一起算）的第一个
# 交易日唤起一次 bot；中间交易日系统侧照常 settle/close，但 bot 不被叫起、不能补做交易。
# 决策日由日历边界派生，不随假期漂移；每个周度决策日自动获得 research_day_timeout 的更宽预算。
bots: [bot_multi]

replay:
  from: "2023-01-03"
  to: "2026-05-29"

calendar: ../runtime/calendar.json

concurrency: 1
chat_step_mode: weekly
per_bot_timeout_seconds: 600
# weekly/monthly 模式下每个决策日本身就是重再平衡，会自动拿 research 预算，无需再配 research_day_every。
research_day_every: 0
research_day_timeout_seconds: 900

fund_mcp_cli: ../../fund-portfolio-mcp/cli_tools.py
simworld_upstream_url: http://127.0.0.1:18078/mcp

buyable_fund_codes:
