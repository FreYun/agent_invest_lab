  - "001512"   # 易方达中债3-5年期国债指数
  - "001550"   # 天弘中证医药100A
  - "001552"   # 天弘中证证券保险A
  - "001617"   # 天弘中证电子ETF联接A
  - "002610"   # 博时黄金ETF联接A
  - "004854"   # 广发中证全指汽车指数A
  - "005223"   # 广发中证基建工程ETF联接A
  - "006451"   # 代表性权益/行业候选
  - "006961"   # 代表性权益/行业候选
