research_loop: /opt/.openclaw/research-loop/ts

bots: [bot1]

replay:
  from: "2024-03-14"
  to: "2024-03-27"   # 10 trading days

calendar: ../runtime/calendar.json

concurrency: 1
per_bot_timeout_seconds: 60
research_day_every: 5
research_day_timeout_seconds: 300

# 系统侧基金生命周期：world setup 调一次 init_fund_account（默认 reset+100w 现金），
# 每天结束调一次 close_my_day。bot 在 BOT_ONLY 端口（28172）只有 place_buy/sell 可用。
fund_mcp_cli: ../../fund-portfolio-mcp/cli_tools.py

# 本轮 user 显式选定的可买基金（6 位代码）。day-1 prompt 会播报；server 端也按这份校验。
buyable_fund_codes:
  - "510300"
  - "159915"
  - "510500"
  - "002611"
  - "159938"

# simworld-data MCP 代理：world 进程内起，注入 simulated_datetime，bot 看不到这个参数。
simworld_upstream_url: http://127.0.0.1:18078/mcp
