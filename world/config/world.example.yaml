# agent_invest_lab 世界配置示例。复制为 config/world.yaml 后按需修改。
# 用法: node --experimental-strip-types main.ts run --config config/world.yaml

# research-loop 仓库路径（agent 大脑；目录里要有 server.ts）
research_loop: /home/rooot/.openclaw/research-loop/ts

# 参与本世界的 bot 列表
bots: [bot1, bot7, bot9]

# 回放区间（含端点；非交易日会被交易日历过滤掉）
replay:
  from: "2024-01-02"
  to:   "2024-06-28"

# bot 模板目录的父目录：world 会在 <bots_root>/<botId>/ 找 IDENTITY/SOUL/AGENTS/skills 等，
# 复制成每个 run 的影子 workspace。默认相对本文件 → ../../bots（即 <repo>/bots/<botId>/，与 <world> 同级）。
# bots_root: /custom/path/to/bots

# research-loop 用的共享技能库（armor/research/portfolio/...），会作为绝对路径注入到
# 生成 rl-config 的 extra_roots。默认相对本文件 → ../../skills（即 <repo>/skills/，与 <world> 同级）。
# skills_root: /custom/path/to/skills

# 凭据 JSON（model api key、browser SSRF 等）。默认相对本文件 → ./openclaw.json
# （即 <world>/config/openclaw.json，已 gitignore）。
# openclaw_json: /home/rooot/.openclaw/openclaw.json

# 交易日历 JSON：{ "trading_days": ["2024-01-02", ...] }（升序、YYYY-MM-DD）。
# 默认相对本文件 → ./calendar.json；world 只消费它、不生成它（由数据团队/人工提供）。
# calendar: /path/to/calendar.json

# 同一天里并发跑多少个 bot
concurrency: 4

# 单 bot 单日 chat 超时（秒）；超时记 status=timeout，不阻塞当天其它 bot、不阻塞翻篇
per_bot_timeout_seconds: 60

# 每隔 N 个交易日给一次更长的 chat 预算（"研究日"，prompt 会显式提示 bot 多调研）。
# 触发：(cursor + 1) % research_day_every === 0，即第 N / 2N / 3N 个交易日。0 = 关闭。
research_day_every: 5
research_day_timeout_seconds: 300

# 给 research-loop 用的 rl-config 基底；默认相对本文件 → ../config/trading-rl-config.base.json
# rl_config_base: /path/to/trading-rl-config.base.json

# research-loop 的 openclaw_dir：控制 bot 的 session/事件/brief 存档写到哪。不填则默认
# 每个 run 一个隔离目录：<world-dir>/runs/<run_id>/rl-openclaw/（world 会把 openclaw_json
# 复制进去）。想用真实 .openclaw 目录就显式填它：
# rl_openclaw_dir: /home/rooot/.openclaw

# 影子 workspace 从 <bots_root>/<botId>/ 复制哪些条目（默认见 src/config.ts DEFAULT_SHADOW_INCLUDE）。
# 默认只复制 config/mcporter.json，不复制 config/research-loop.*，避免 bot 原 workspace 配置覆盖
# world 传入的 shadow workspace / run 专属 rl-config。
# shadow_include: [IDENTITY.md, SOUL.md, AGENTS.md, USER.md, METHODOLOGY.md, RESEARCH.md, MEMORY.md, EQUIPPED_SKILLS.md, TOOLS.md, skills, config/mcporter.json]

# === Loop（agent runtime）选择 ===
# 整 run 一种 loop，不混用。值：research-loop（默认）| openclaw-pi
# loop: research-loop

# === openclaw-pi loop 专用配置（只在 loop=openclaw-pi 时生效）===
#
# openclaw-pi 复用上面的 openclaw_json 作为凭据源。world 启动时把它复制进
# runs/<run>/rl-openclaw/openclaw.json，并把 mcp.mem0 改写为本 run 的隔离 memory
# server URL，pi-server 从该副本读配置。
#
# openclaw 仓根路径。用于推断 pi_server_entry。默认 /home/rooot/.openclaw/openclaw
# openclaw_root: /path/to/openclaw
#
# pi-stdio-server 入口路径覆盖（测试/非常规布局用）。默认从 openclaw_root 推断：
#   <openclaw_root>/src/agents/agent_invest_pi_stdio_server.ts
# pi_server_entry: /path/to/agent_invest_pi_stdio_server.ts
#
# pi session 持久化目录。pi-server 把每次 chat 的 jsonl 落到
#   <pi_sessions_dir>/<botId>/<sessionId>.jsonl
# 不再像默认的临时文件那样跑完即删。默认相对本文件 → ../../session（即 <repo>/session/）。
# pi_sessions_dir: /custom/path/to/session

# === simworld-data MCP 代理（必选）===
# world 进程内起一个 streamable-http MCP 代理包住这个上游：
#   - tools/list 把每个工具的 simulated_datetime 从 inputSchema 里删掉（bot 看不到这个参数）
#   - tools/call 强制注入 simulated_datetime = <当天world日期> 15:00:00（A股收盘）
# bot 的 config/mcporter.json 用 ${SIMWORLD_PROXY_URL} 占位符引用代理监听 URL，
# buildShadowWorkspace 拷贝时会替换为实际 URL。
simworld_upstream_url: http://127.0.0.1:18078/mcp
