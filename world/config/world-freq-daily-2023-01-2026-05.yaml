research_loop: /home/rooot/.openclaw/research-loop/ts
research_loop_rust_bin: /home/rooot/.openclaw/research-loop/rust/target/release/research-loop-rust2

# ── 决策频次对照实验 · 日度臂 ──────────────────────────────────────────────
# 三份 config（daily / weekly / monthly）唯一的差别就是 chat_step_mode，其余完全一致
# （同一 bot_multi、同区间、同可买池、同预算），用来隔离"决策频次"这一个变量对净值/回撤的影响。
# 在 backtest-dashboard 上把三个 run 叠在一起对比即可。
bots: [bot_multi]

replay:
  from: "2023-01-03"
  to: "2026-05-29"

calendar: ../runtime/calendar.json

concurrency: 1
# 日度：每个交易日都唤起 bot，单次决策较轻，给标准预算。
chat_step_mode: trading_days
chat_step_days: 1
per_bot_timeout_seconds: 600
# 日度臂不靠周期块，每隔 20 个交易日给一次更深的研究预算，与周/月度臂的深思节奏大致对齐。
research_day_every: 20
research_day_timeout_seconds: 900

fund_mcp_cli: ../../fund-portfolio-mcp/cli_tools.py
simworld_upstream_url: http://127.0.0.1:18078/mcp

buyable_fund_codes:
  - "000051"   # 华夏沪深300ETF联接A
  - "000962"   # 天弘中证500ETF联接A
  - "001512"   # 易方达中债3-5年期国债指数
  - "001550"   # 天弘中证医药100A
  - "001552"   # 天弘中证证券保险A
  - "001617"   # 天弘中证电子ETF联接A
  - "002610"   # 博时黄金ETF联接A
  - "004854"   # 广发中证全指汽车指数A
  - "005223"   # 广发中证基建工程ETF联接A
  - "006451"   # 代表性权益/行业候选
  - "006961"   # 代表性权益/行业候选
  - "012543"   # 嘉实中证新能源汽车指数A
  - "161907"   # 红利ETF联接
  - "518880"   # 黄金ETF
